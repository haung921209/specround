<!doctype html>
<!--
  The whole front end: one file, no build step, no network beyond this process.

  The load-bearing idea is that the server hands down text runs carrying their
  document offsets (see specround/markdown.py), so turning a selection into an
  anchor is arithmetic on `data-s` rather than a guess about what the reader
  meant. Every mode below plays by that one rule, which is why a comment made on
  the render, on the raw text, or on a diff row is the same comment (SPEC §3).
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>specround</title>
<style>
  :root {
    --bg: #fbfbfa; --panel: #fff; --ink: #1a1a19; --dim: #6b6b66; --line: #e2e1dc;
    --accent: #2f6f5e; --warn: #9a5b12; --bad: #a33; --mark: #fff3bf; --markopen: #ffe08a;
    --add: #e9f6ec; --del: #fdecec; --mono: ui-monospace, SFMono-Regular, Menlo, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #17181a; --panel: #1e2023; --ink: #e6e5e1; --dim: #9a9a94; --line: #33363a;
      --accent: #7fc0ac; --warn: #d99a4e; --bad: #e08a8a; --mark: #4a4423; --markopen: #6b5f22;
      --add: #1d2d22; --del: #33211f;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font: 15px/1.6 system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  header {
    position: sticky; top: 0; z-index: 5; background: var(--panel);
    border-bottom: 1px solid var(--line); padding: 8px 14px;
    display: flex; flex-wrap: wrap; gap: 10px; align-items: center;
  }
  header .doc { font-weight: 600; }
  header .meta { color: var(--dim); font-size: 13px; font-family: var(--mono); }
  header .grow { flex: 1; }
  .modes { display: flex; border: 1px solid var(--line); border-radius: 6px; overflow: hidden; }
  .modes button { border: 0; background: transparent; color: var(--ink); padding: 5px 12px; cursor: pointer; font: inherit; }
  .modes button[aria-pressed="true"] { background: var(--accent); color: #fff; }
  button, select, input, textarea { font: inherit; color: var(--ink); }
  .btn {
    background: var(--panel); border: 1px solid var(--line); border-radius: 6px;
    padding: 4px 10px; cursor: pointer;
  }
  .btn.primary { background: var(--accent); color: #fff; border-color: var(--accent); }
  .btn:disabled { opacity: .5; cursor: not-allowed; }
  #notice { padding: 6px 14px; font-size: 13px; border-bottom: 1px solid var(--line); display: none; }
  #notice.show { display: block; }
  #notice.bad { background: var(--del); color: var(--bad); }
  #notice.info { background: var(--panel); color: var(--dim); }
  main { display: grid; grid-template-columns: minmax(0, 1fr) 380px; gap: 0; align-items: start; }
  /* The navigation bar exists only when the server was started on a directory.
     A file view keeps the two-column layout it always had, to the pixel. */
  main.tree { grid-template-columns: 260px minmax(0, 1fr) 380px; }
  @media (max-width: 900px) { main, main.tree { grid-template-columns: minmax(0, 1fr); } }
  nav#files { display: none; }
  main.tree nav#files {
    display: block; position: sticky; top: 49px; max-height: calc(100vh - 49px);
    overflow-y: auto; border-right: 1px solid var(--line); background: var(--panel); padding: 12px;
  }
  nav#files h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .05em; color: var(--dim); margin: 0 0 8px; }
  nav#files .note { font-size: 12px; color: var(--dim); margin-top: 10px; line-height: 1.45; }
  .file {
    display: block; width: 100%; text-align: left; font: inherit; cursor: pointer;
    background: transparent; color: var(--dim); border: 0; border-left: 3px solid transparent;
    padding: 5px 7px; border-radius: 0 6px 6px 0; margin-top: 2px;
  }
  .file:hover { background: var(--bg); }
  /* Two different things, and they must not look like one: the accent edge says
     "this document has review on it", the filled row says "this is the one you
     are reading". A reviewer scanning for the first should not have to work out
     which of them the highlight means. */
  .file.active { color: var(--ink); border-left-color: var(--accent); }
  .file[aria-current="true"] { background: var(--bg); color: var(--ink); font-weight: 600; }
  .file .name { display: block; font-size: 13px; word-break: break-all; }
  .file .marks { display: block; margin-top: 3px; }
  #doc { padding: 18px 22px 60vh; min-width: 0; }
  #doc h1, #doc h2, #doc h3, #doc h4 { line-height: 1.3; margin: 1.4em 0 .5em; }
  #doc h1 { font-size: 1.6em; } #doc h2 { font-size: 1.3em; } #doc h3 { font-size: 1.1em; }
  #doc pre {
    background: var(--panel); border: 1px solid var(--line); border-radius: 6px;
    padding: 10px 12px; overflow-x: auto; font-family: var(--mono); font-size: 13px;
  }
  #doc table { border-collapse: collapse; margin: 1em 0; display: block; overflow-x: auto; }
  #doc th, #doc td { border: 1px solid var(--line); padding: 4px 9px; text-align: left; }
  #doc blockquote { margin: 1em 0; padding-left: 12px; border-left: 3px solid var(--line); color: var(--dim); }
  #doc code { font-family: var(--mono); font-size: .9em; background: var(--panel); padding: 1px 4px; border-radius: 3px; }
  #doc pre code { background: none; padding: 0; }
  #doc hr { border: 0; border-top: 1px solid var(--line); margin: 1.6em 0; }
  #doc.raw, #doc.diff { font-family: var(--mono); font-size: 13px; line-height: 1.55; }
  .line { display: flex; }
  .line .ln {
    flex: 0 0 4.5ch; text-align: right; padding-right: 1.2ch; color: var(--dim);
    user-select: none; -webkit-user-select: none;
  }
  /* The gutter is a comment target, so it has to look like one — a reader who
     does not know a selection can be commented on still knows a line number can
     be clicked. Gated on `.live` because a pointer over a round that cannot take
     comments would promise a click that goes nowhere. */
  #doc.live .line .ln { cursor: pointer; }
  #doc.live .line .ln:hover { background: var(--line); color: var(--ink); }
  .line .body { white-space: pre-wrap; word-break: break-word; flex: 1; min-width: 0; }
  .line.added { background: var(--add); }
  .line.removed { background: var(--del); }
  .line .sign { flex: 0 0 2ch; color: var(--dim); user-select: none; -webkit-user-select: none; }
  mark.anch { background: var(--mark); color: inherit; border-radius: 2px; cursor: pointer; }
  mark.anch.open { background: var(--markopen); }
  .caret { color: var(--accent); font-weight: 700; cursor: pointer; }
  /* One highlight for both kinds of anchor. A run of text and an insertion point
     are the same claim about where a comment sits, and a focused caret that lit
     up nothing left the reviewer hunting for a mark the document never had. */
  mark.anch.here, .caret.here { outline: 2px solid var(--accent); }
  aside {
    position: sticky; top: 49px; max-height: calc(100vh - 49px); overflow-y: auto;
    border-left: 1px solid var(--line); background: var(--panel); padding: 12px;
  }
  aside h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .05em; color: var(--dim); margin: 0 0 8px; }
  .card { border: 1px solid var(--line); border-radius: 8px; padding: 9px 10px; margin-bottom: 10px; background: var(--bg); }
  .card.here { border-color: var(--accent); }
  .card .who { font-size: 12px; color: var(--dim); font-family: var(--mono); }
  .card .quote {
    font-family: var(--mono); font-size: 12px; color: var(--dim);
    border-left: 2px solid var(--line); padding-left: 6px; margin: 5px 0;
    white-space: pre-wrap; word-break: break-word; max-height: 5.5em; overflow: hidden;
  }
  .card .body { white-space: pre-wrap; word-break: break-word; }
  .card pre.patch {
    font-family: var(--mono); font-size: 12px; background: var(--panel); border: 1px solid var(--line);
    border-radius: 6px; padding: 6px 8px; overflow-x: auto; margin: 6px 0;
  }
  .card .reply { border-left: 2px solid var(--line); margin: 6px 0 0 8px; padding-left: 7px; font-size: 14px; }
  .tag {
    display: inline-block; font-size: 11px; font-family: var(--mono); border: 1px solid var(--line);
    border-radius: 10px; padding: 0 7px; margin-right: 4px; color: var(--dim);
  }
  .tag.open { color: var(--accent); border-color: var(--accent); }
  .tag.warn { color: var(--warn); border-color: var(--warn); }
  .tag.bad { color: var(--bad); border-color: var(--bad); }
  /* The badge saying itself again, for a card asked to point at a document that
     no longer holds its text. Twice and slowly: three times a second is where a
     flash stops being emphasis and starts being a hazard, and a reviewer who has
     asked not to be moved still gets the one fade. */
  @keyframes orphanflash { from { background: var(--del); } to { background: transparent; } }
  .tag.orphan.flash { animation: orphanflash .6s ease-out 2; }
  @media (prefers-reduced-motion: reduce) {
    .tag.orphan.flash { animation-iteration-count: 1; animation-duration: 1.2s; }
  }
  .acts { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 7px; }
  textarea { width: 100%; min-height: 60px; resize: vertical; padding: 6px 8px;
    border: 1px solid var(--line); border-radius: 6px; background: var(--panel); }
  input[type=text] { padding: 4px 7px; border: 1px solid var(--line); border-radius: 6px; background: var(--panel); }
  #float {
    position: absolute; display: none; z-index: 9;
    box-shadow: 0 2px 8px rgba(0,0,0,.18);
  }
  #float.show { display: block; }
  #editor { display: none; padding: 0 22px 22px; }
  #editor.show { display: block; }
  #editor textarea { min-height: 55vh; font-family: var(--mono); font-size: 13px; }
  .row { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; margin-top: 6px; }
  label.check { font-size: 13px; color: var(--dim); display: flex; gap: 5px; align-items: center; }
  .empty { color: var(--dim); font-size: 14px; }
</style>
</head>
<body>
<header>
  <span class="doc" id="docname">…</span>
  <span class="meta" id="roundmeta"></span>
  <span class="grow"></span>
  <div class="modes" role="group" aria-label="view mode">
    <button data-mode="render" aria-pressed="true">render</button>
    <button data-mode="raw" aria-pressed="false">raw</button>
    <button data-mode="diff" aria-pressed="false">diff</button>
  </div>
  <label class="check">author <input type="text" id="author" size="12"></label>
  <label class="check">as
    <select id="actor"><option value="human">human</option><option value="agent">agent</option></select>
  </label>
  <button class="btn" id="refresh" title="re-read the ledger and the document">reload</button>
</header>
<div id="notice"></div>
<main id="layout">
  <nav id="files" aria-label="documents in this workspace"></nav>
  <div>
    <div id="doc"></div>
    <div id="editor">
      <textarea id="edittext" spellcheck="false"></textarea>
      <div class="row">
        <input type="text" id="editwhy" placeholder="why (optional)" size="40">
        <button class="btn primary" id="propose">propose as suggestion</button>
        <button class="btn" id="editcancel">cancel</button>
        <span class="meta" id="editnote"></span>
      </div>
    </div>
  </div>
  <aside>
    <div id="composer"></div>
    <h2 id="threadhead">threads</h2>
    <label class="check"><input type="checkbox" id="showresolved"> show resolved</label>
    <div id="threads"></div>
  </aside>
</main>
<button class="btn primary" id="float">comment</button>

<script>
"use strict";
const TOKEN = new URLSearchParams(location.search).get("t") || "";
const $ = (id) => document.getElementById(id);
// `doc` is which document of a workspace the page is reading, as the workspace
// names it. It goes on every request rather than being remembered by the
// server: the process holds no selection, which is what lets two tabs on one
// port read two documents at once. Null until the first state arrives, and
// always null for a file view, where the server serves the one document it has.
// `reply` is the inline reply editors: `open` is the one card showing one, and
// `drafts` is what has been typed on any card, open or not. Two fields because
// they answer different questions — a card can hold words nobody is looking at,
// and a card can be open with nothing typed into it yet.
const state = {
  data: null, doc: null, mode: "render", focused: null, editing: false, activeOnly: false,
  reply: { open: null, drafts: {} },
};

// -- transport ------------------------------------------------------------

async function api(path, body) {
  const options = {
    headers: { "X-Specround-Token": TOKEN, "Content-Type": "application/json" },
    method: body === undefined ? "GET" : "POST",
  };
  if (body !== undefined) options.body = JSON.stringify(body);
  const query = new URLSearchParams({ t: TOKEN });
  if (state.doc) query.set("doc", state.doc);
  const response = await fetch(path + "?" + query.toString(), options);
  const text = await response.text();
  let payload = null;
  try { payload = text ? JSON.parse(text) : null; } catch (e) { payload = null; }
  if (!response.ok) {
    // The server answers in the ledger's own words. Passing the message through
    // unchanged is the point: it names the fix ("open a round", "reopen it").
    throw new Error((payload && payload.error && payload.error.message) || text || response.statusText);
  }
  return payload;
}

function notice(message, kind) {
  const box = $("notice");
  box.textContent = message || "";
  box.className = message ? "show " + (kind || "info") : "";
}

async function act(body, path) {
  try {
    await api(path, body);
    notice("");
    await load();
    return true;
  } catch (error) {
    notice(String(error.message || error), "bad");
    return false;
  }
}

// -- text runs ------------------------------------------------------------
//
// One rule for all three modes: an element with `data-s` holds text that is
// verbatim document content starting at that offset, in the space named by
// `data-space` (the round's base unless it says otherwise). Everything below
// reads or writes offsets through that, and nothing else.

function holderOf(node) {
  const element = node && node.nodeType === 3 ? node.parentElement : node;
  return element && element.closest ? element.closest("[data-s]") : null;
}

function offsetIn(holder, node, offset) {
  if (node === holder || node.nodeType !== 3) {
    // A boundary landed on the element itself; the honest reading is its edge.
    return offset === 0 ? 0 : holder.textContent.length;
  }
  let seen = 0;
  const walker = document.createTreeWalker(holder, NodeFilter.SHOW_TEXT);
  let current;
  while ((current = walker.nextNode())) {
    if (current === node) return seen + offset;
    seen += current.nodeValue.length;
  }
  return seen;
}

function textIn(space) {
  // The text a span's offsets count in. One lookup for every converter below, so
  // that two of them cannot disagree about which document they are measuring.
  return (space === "base" ? state.data.base : state.data.live) || "";
}

function selectedSpan() {
  if (!state.data) return null;
  const selection = window.getSelection();
  if (!selection || selection.isCollapsed || !selection.rangeCount) return null;
  const range = selection.getRangeAt(0);
  const head = holderOf(range.startContainer);
  const tail = holderOf(range.endContainer);
  if (!head || !tail) return null;
  const space = head.dataset.space || "base";
  if ((tail.dataset.space || "base") !== space) return null;
  const start = Number(head.dataset.s) + offsetIn(head, range.startContainer, range.startOffset);
  const end = Number(tail.dataset.s) + offsetIn(tail, range.endContainer, range.endOffset);
  if (end <= start) return null;
  return { space, start, end, quote: textIn(space).slice(start, end) };
}

function commentOnLine(space, start, text) {
  // The cheap gesture: one click on a line number instead of a drag across the
  // line. It goes through the same composer and the same route a selection does,
  // so a line the revision alone has meets the refusal that was already there
  // rather than a second one written for this path.
  commentBox(spanOfRun(space, start, text, textIn(space)));
}

// -- the pure part --------------------------------------------------------
//
// These touch neither the DOM nor `state`, and the tests lift this block out and
// run it. Everything else on this page needs a browser to mean anything; this is
// the part a machine can hold to account, and the line-to-anchor conversion
// belongs in it because it is the one offset the page works out for itself
// rather than receiving from the server.

function rawLines(text) {
  // One entry per line, each carrying the offset its first character sits at.
  // A document that ends with a break has an empty line after it, and that line
  // is real: its gutter is where a reviewer says something belongs at the end.
  const out = [];
  let at = 0;
  for (;;) {
    const stop = text.indexOf("\n", at);
    const cut = stop === -1 ? text.length : stop;
    out.push({ start: at, text: text.slice(at, cut) });
    if (stop === -1) return out;
    at = stop + 1;
  }
}

function spanOfRun(space, start, text, source) {
  // A line is a whole run: `lineRow` gives every line exactly one `data-s`
  // holder, so "this line" is that holder's extent and there is nothing new to
  // measure. The quote comes off the source rather than the run for the reason
  // `selectedSpan` does the same — the offsets are the claim, and the text on
  // screen is only ever a copy of what they name. An empty line therefore yields
  // a zero-width span, which is an insertion point (§5) and not a mistake.
  const end = start + text.length;
  return { space, start, end, quote: source.slice(start, end) };
}

function modeClass(mode, commentable) {
  return commentable ? mode + " live" : mode;
}

function visibleDocuments(documents, activeOnly) {
  // The activity filter, and the whole of it: the bar always receives the full
  // listing and hides rows here. Asking the server for a filtered list instead
  // would make the counts beside the checkbox describe a set the page cannot
  // see, and "3 of 40 reviewed" is the number that makes the toggle worth a click.
  return activeOnly ? documents.filter((entry) => entry.active) : documents;
}

function badges(entry) {
  // What a reviewer scans a file list for, in the order they scan for it. The
  // numbers are the server's; nothing is recomputed here, because a bar that
  // counted them itself would be a second oracle for a word the ledger defines.
  // A document that was reviewed and has nothing outstanding still says so —
  // "reviewed, nothing owed" and "never looked at" are different answers and a
  // blank row would give them the same one.
  //
  // The badge is the disposition axis: comments with no verdict. It used to be
  // spelled "unresolved", which is the thread axis's word — so a reviewer who
  // had just resolved a thread read this badge as the bar ignoring them.
  const out = [];
  if (entry.error) out.push({ text: "unreadable", kind: "bad" });
  if (entry.open_rounds) out.push({ text: entry.open_rounds + " open", kind: "open" });
  if (entry.undisposed) out.push({ text: entry.undisposed + " undisposed", kind: "warn" });
  if (entry.orphans) out.push({ text: entry.orphans + " orphaned", kind: "bad" });
  if (!out.length && entry.rounds) out.push({ text: "reviewed", kind: "" });
  return out;
}

function focusScroll(origin, present) {
  // Which side of the screen moves when a comment is focused: the side the click
  // did not come from. A reviewer who clicks a mark is reading the document and
  // wants the thread; one who clicks a card is reading the thread and wants the
  // place. Moving both takes the viewport out from under whichever one they were
  // actually reading, and in the same scroll parent the two would chase each
  // other. So this answers with exactly one, and the caller scrolls only that.
  //
  // `""` is a no-op and is an ordinary answer rather than a failure: a card can
  // be filtered out of the list, and an anchor can sit on a line the diff is
  // hiding or in a mode that does not draw it. Nothing is wrong in either case
  // and there is nowhere to go, so the page stays where the reviewer put it.
  //
  // "orphan" is the one absence worth saying out loud, and what makes it worth
  // saying is that it is the ledger's word rather than the screen's: a comment
  // the document lost is a standing fact about the review, not a mode this view
  // happens to be in. An orphan the page can still place is scrolled to like any
  // other — orphaning keeps the last good anchor rather than forgetting it (§4),
  // so there is somewhere to go, and going there beats announcing a state the
  // card is already showing.
  if (origin !== "card") return present.card ? "card" : "";
  if (present.mark) return "anchor";
  return present.orphaned ? "orphan" : "";
}

function replyAfter(reply, action) {
  // The whole rule for the inline reply editors, in one place, so that the six
  // handlers that move them cannot each hold a slightly different version of it.
  //
  // Two things are being kept true at once. At most one editor is open, because
  // two textareas with a cursor in one of them is how a reviewer answers the
  // wrong thread. And no editor closes on words it was not told to drop: the
  // one gesture that means "I do not want this" is `discard` (the cancel
  // button, and a reply that went through), while turning to another card only
  // `open`s that one and leaves the first card's half-sentence on the card it
  // was meant for. Losing a draft to a click that was about some other thread
  // is the failure this split exists to make impossible.
  //
  // `close` is that same stowing without naming a replacement — what a top
  // composer does when it takes the page's one cursor.
  const drafts = Object.assign({}, reply.drafts);
  if (action.kind === "reset") return { open: null, drafts: {} };
  if (action.kind === "open") return { open: action.id, drafts };
  if (action.kind === "close") return { open: null, drafts };
  if (action.kind === "type") {
    // An emptied box is not a draft. Otherwise a reviewer who selected their
    // words and deleted them would still be told a draft was waiting.
    if (action.text) drafts[action.id] = action.text;
    else delete drafts[action.id];
    return { open: reply.open, drafts };
  }
  if (action.kind === "discard") {
    delete drafts[action.id];
    return { open: reply.open === action.id ? null : reply.open, drafts };
  }
  // Every caller passes a literal, so an unknown kind is a typo, and a typo
  // that returned the state unchanged would look exactly like a dead button.
  throw new Error("unknown reply action: " + action.kind);
}

function replyLabel(reply, id) {
  // A draft nobody can see has to say it is there. Without this, a card whose
  // editor was stowed to open another one is indistinguishable from a card that
  // lost what was typed into it — and "it lost my words" is the reading a
  // reviewer will reach for first.
  return !reply.drafts[id] || reply.open === id ? "reply" : "reply · draft";
}

// -- end of the pure part -------------------------------------------------

// -- painting anchors ------------------------------------------------------

function paint(container, comments) {
  const anchored = comments.filter((c) => c.current_anchor);
  container.querySelectorAll("[data-s]").forEach((element) => {
    if ((element.dataset.space || "base") !== "base") return;
    const start = Number(element.dataset.s);
    const text = element.textContent;
    const end = start + text.length;
    const spans = anchored.filter((c) => c.current_anchor.start < end && c.current_anchor.end > start);
    const points = anchored.filter(
      (c) => c.current_anchor.start === c.current_anchor.end
          && c.current_anchor.start >= start && c.current_anchor.start <= end
    );
    if (!spans.length && !points.length) return;
    const clamp = (at) => Math.max(0, Math.min(text.length, at - start));
    const cuts = new Set([0, text.length]);
    spans.forEach((c) => { cuts.add(clamp(c.current_anchor.start)); cuts.add(clamp(c.current_anchor.end)); });
    points.forEach((c) => cuts.add(clamp(c.current_anchor.start)));
    const ordered = [...cuts].sort((a, b) => a - b);
    const fragment = document.createDocumentFragment();
    const caretsAt = (at) => points.filter((c) => clamp(c.current_anchor.start) === at);
    for (let index = 0; index < ordered.length; index += 1) {
      const at = ordered[index];
      caretsAt(at).forEach((c) => fragment.appendChild(caret(c)));
      const next = ordered[index + 1];
      if (next === undefined || next === at) continue;
      const piece = text.slice(at, next);
      const covering = spans.filter(
        (c) => clamp(c.current_anchor.start) <= at && clamp(c.current_anchor.end) >= next
      );
      if (!covering.length) { fragment.appendChild(document.createTextNode(piece)); continue; }
      const mark = document.createElement("mark");
      mark.className = "anch" + (covering.some((c) => c.undisposed) ? " open" : "");
      mark.dataset.comments = covering.map((c) => c.id).join(" ");
      mark.textContent = piece;
      fragment.appendChild(mark);
    }
    element.textContent = "";
    element.appendChild(fragment);
  });
  container.querySelectorAll("mark.anch, .caret").forEach((mark) => {
    mark.addEventListener("click", (event) => {
      event.stopPropagation();
      focus(mark.dataset.comments.split(" ")[0], "mark");
    });
  });
}

function caret(comment) {
  const element = document.createElement("span");
  element.className = "caret";
  element.dataset.comments = comment.id;
  element.textContent = "‸";
  element.title = "insertion point — " + comment.id;
  return element;
}

// -- the three modes ------------------------------------------------------

function drawRender(host, data) {
  host.className = "";
  host.innerHTML = data.render;
}

function drawRaw(host, data) {
  host.className = modeClass("raw", data.commentable);
  host.textContent = "";
  rawLines(data.base || "").forEach((line, index) => {
    host.appendChild(lineRow(String(index + 1), "", line.text, line.start, "base", ""));
  });
}

function drawDiff(host, data) {
  host.className = modeClass("diff", data.commentable);
  host.textContent = "";
  const diff = data.diff;
  if (!diff.available) {
    host.innerHTML = '<p class="empty">No diff: this needs both a round and a readable document.</p>';
    return;
  }
  const only = $("changesonly") && $("changesonly").checked;
  diff.rows.forEach((row) => {
    if (only && row.op === "same") return;
    const sign = row.op === "added" ? "+" : row.op === "removed" ? "-" : " ";
    const space = row.op === "added" ? "revision" : "base";
    const start = row.op === "added" ? row.live_start : row.base_start;
    host.appendChild(
      lineRow(row.base_line ? String(row.base_line) : "", row.live_line ? String(row.live_line) : "",
              row.text, start, space, row.op, sign)
    );
  });
  if (!host.children.length) {
    host.innerHTML = '<p class="empty">Nothing changed since this round froze the document.</p>';
  }
}

function lineRow(left, right, text, start, space, cls, sign) {
  const line = document.createElement("div");
  line.className = "line" + (cls ? " " + cls : "");
  const gutters = [];
  const gutterLeft = document.createElement("span");
  gutterLeft.className = "ln";
  gutterLeft.textContent = left;
  gutters.push(gutterLeft);
  line.appendChild(gutterLeft);
  if (right !== "" || sign !== undefined) {
    const gutterRight = document.createElement("span");
    gutterRight.className = "ln";
    gutterRight.textContent = right;
    gutters.push(gutterRight);
    line.appendChild(gutterRight);
  }
  if (sign !== undefined) {
    const marker = document.createElement("span");
    marker.className = "sign";
    marker.textContent = sign;
    line.appendChild(marker);
  }
  const body = document.createElement("span");
  body.className = "body t";
  body.dataset.s = String(start);
  body.dataset.space = space;
  body.textContent = text;
  line.appendChild(body);
  // Both numbers act on the row they number: a diff row is one text in one space,
  // whichever side of the gutter counted it. Wired only where a comment can be
  // recorded, off the same reading of the state that puts `.live` on the host —
  // one rule, one place. If the round closes under a page that is still open the
  // click posts anyway and the ledger refuses it in its own words; a check here
  // would be a second oracle for a rule this page does not own.
  //
  // The text is captured rather than read back off the element, because by the
  // time anyone clicks, `paint` may have inserted a caret into it — the offsets
  // are the record of what this line is, and the DOM is not.
  if (state.data && state.data.commentable) {
    gutters.forEach((gutter) => {
      gutter.title = "comment on this line";
      gutter.addEventListener("click", () => commentOnLine(space, start, text));
    });
  }
  return line;
}

function draw() {
  const data = state.data;
  const host = $("doc");
  if (!data.round) {
    host.className = "";
    host.innerHTML = '<p class="empty">' + escapeHtml(data.blocked || "nothing to show") + "</p>";
    return;
  }
  if (state.mode === "raw") drawRaw(host, data);
  else if (state.mode === "diff") drawDiff(host, data);
  else drawRender(host, data);
  paint(host, data.comments);
  if (state.focused) markFocus();
}

// -- the workspace bar ----------------------------------------------------
//
// Navigation and nothing else. Clicking a file re-asks the server for that
// document and everything below this point redraws from the answer — there is
// no per-document state here to keep in step, which is why switching documents
// cannot leave a comment pointed at the wrong one.

function drawFiles() {
  const workspace = state.data.workspace;
  $("layout").className = workspace ? "tree" : "";
  const host = $("files");
  host.textContent = "";
  if (!workspace) return;
  const shown = visibleDocuments(workspace.documents, state.activeOnly);
  const head = document.createElement("h2");
  head.textContent = "documents — " + workspace.counts.active + " of "
    + workspace.counts.documents + " reviewed";
  host.appendChild(head);
  const filter = document.createElement("label");
  filter.className = "check";
  const box = document.createElement("input");
  box.type = "checkbox";
  box.checked = state.activeOnly;
  box.addEventListener("change", () => { state.activeOnly = box.checked; drawFiles(); });
  filter.appendChild(box);
  filter.appendChild(document.createTextNode(" with review activity only"));
  host.appendChild(filter);
  shown.forEach((entry) => host.appendChild(fileRow(entry, workspace.selected)));
  const notes = [];
  if (!shown.length) notes.push("No document here has been reviewed yet. Untick to see them all.");
  else if (shown.length < workspace.documents.length) {
    notes.push((workspace.documents.length - shown.length) + " with no review activity, hidden by the filter.");
  }
  // The server's own note about what it held back. Passed through rather than
  // reworded: a bar that showed a shorter tree without saying so would read as
  // "this is the whole tree", which is the one thing it must never imply.
  if (workspace.note) notes.push(workspace.note + ".");
  if (notes.length) {
    const note = document.createElement("p");
    note.className = "note";
    note.textContent = notes.join(" ");
    host.appendChild(note);
  }
}

function fileRow(entry, selected) {
  const element = document.createElement("button");
  element.type = "button";
  element.className = "file" + (entry.active ? " active" : "");
  element.setAttribute("aria-current", String(entry.key === selected));
  element.title = entry.error
    || (entry.last_activity ? "last activity " + entry.last_activity : "no review here yet");
  const name = document.createElement("span");
  name.className = "name";
  name.textContent = entry.key;
  element.appendChild(name);
  const marks = badges(entry);
  if (marks.length) {
    const row = document.createElement("span");
    row.className = "marks";
    row.innerHTML = marks.map((mark) => tag(mark.text, mark.kind)).join("");
    element.appendChild(row);
  }
  element.addEventListener("click", () => openDocument(entry.key));
  return element;
}

function openDocument(key) {
  // Everything the old document put on screen goes with it. A composer left
  // open would post its comment against whichever document answered next, and
  // a focused thread id means nothing on a ledger that never saw it.
  if (key === state.doc) return;
  state.doc = key;
  state.focused = null;
  clearComposer();
  if (state.editing) stopEditing();
  notice("");
  load().catch((error) => notice(String(error.message || error), "bad"));
}

// -- threads --------------------------------------------------------------

function tag(text, kind) {
  return '<span class="tag ' + (kind || "") + '">' + escapeHtml(text) + "</span>";
}

function escapeHtml(text) {
  return String(text).replace(/[&<>]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" }[c]));
}

function anchorLabel(comment) {
  const anchor = comment.current_anchor;
  if (!anchor) return "(the whole document)";
  if (anchor.start === anchor.end) return "(insertion point at " + anchor.start + ")";
  return anchor.exact;
}

function drawThreads() {
  const data = state.data;
  const showResolved = $("showresolved").checked;
  const hidden = data.comments.filter((c) => c.resolved).length;
  const shown = data.comments.filter((c) => showResolved || !c.resolved);
  $("threadhead").textContent =
    "threads — " + shown.length + " shown, " + data.counts.undisposed + " undisposed"
    + (hidden && !showResolved ? ", " + hidden + " resolved and hidden" : "");
  const host = $("threads");
  host.textContent = "";
  if (!shown.length) {
    host.innerHTML = '<p class="empty">'
      + (hidden ? hidden + " resolved thread(s), hidden by default — tick the box above."
                : "No comments yet. Select text in any mode, or click a line "
                  + "number in raw or diff, to leave one.")
      + "</p>";
    return;
  }
  shown.forEach((comment) => host.appendChild(card(comment)));
}

function card(comment) {
  const element = document.createElement("div");
  element.className = "card" + (state.focused === comment.id ? " here" : "");
  element.dataset.comment = comment.id;
  const tags = [tag(comment.kind), tag(comment.state, comment.undisposed ? "open" : "")];
  if (comment.resolved) tags.push(tag("resolved"));
  // `orphan` beside `bad` names what the badge is rather than how it looks, so
  // the one place that draws attention to it has something to aim at that will
  // not move when the colour does.
  if (comment.orphaned) tags.push(tag("orphaned", "bad orphan"));
  if (comment.strategy === "fuzzy") tags.push(tag("fuzzy", "warn"));
  if (comment.ambiguous) tags.push(tag("ambiguous", "warn"));
  if (comment.ext && comment.ext.view) tags.push(tag("from " + comment.ext.view.space));
  element.innerHTML =
    '<div class="who">' + escapeHtml(comment.id) + " · " + escapeHtml(comment.author)
      + " · " + escapeHtml(comment.ts) + "</div>"
    + "<div>" + tags.join("") + "</div>"
    + '<div class="quote">' + escapeHtml(anchorLabel(comment)) + "</div>"
    + (comment.body ? '<div class="body">' + escapeHtml(comment.body) + "</div>" : "")
    + (comment.patch ? '<pre class="patch">' + escapeHtml(comment.patch) + "</pre>" : "")
    + comment.replies.map((reply) =>
        '<div class="reply"><span class="who">' + escapeHtml(reply.author) + "</span> "
        + escapeHtml(reply.body) + "</div>").join("")
    + (comment.dispositions.length
        ? '<div class="who">' + comment.dispositions.map((d) =>
            escapeHtml(d.verdict + " — " + d.reason)).join("<br>") + "</div>"
        : "");

  const actions = document.createElement("div");
  actions.className = "acts";
  actions.appendChild(button("reply", () => replyBox(comment)));
  if (comment.undisposed) actions.appendChild(button("dispose", () => disposeBox(comment)));
  actions.appendChild(button(comment.resolved ? "reopen" : "resolve", () => threadBox(comment)));
  element.appendChild(actions);
  element.addEventListener("click", () => focus(comment.id, "card"));
  return element;
}

function button(label, onClick, primary) {
  const element = document.createElement("button");
  element.className = "btn" + (primary ? " primary" : "");
  element.textContent = label;
  element.addEventListener("click", (event) => { event.stopPropagation(); onClick(); });
  return element;
}

// -- composers ------------------------------------------------------------

function clearComposer() {
  $("composer").textContent = "";
}

function panel(title) {
  const host = $("composer");
  host.textContent = "";
  const box = document.createElement("div");
  box.className = "card here";
  const head = document.createElement("div");
  head.className = "who";
  head.textContent = title;
  box.appendChild(head);
  host.appendChild(box);
  return box;
}

function commentBox(span) {
  const box = panel(span ? "comment on the selection" : "comment on the whole document");
  if (span) {
    const quote = document.createElement("div");
    quote.className = "quote";
    quote.textContent = span.quote;
    box.appendChild(quote);
    if (span.space === "revision") {
      const note = document.createElement("div");
      note.className = "who";
      note.textContent = "selected in the revision — it will be carried into the round's base";
      box.appendChild(note);
    }
  }
  const area = document.createElement("textarea");
  area.placeholder = "what is wrong with this, or what it should say";
  box.appendChild(area);
  const actions = document.createElement("div");
  actions.className = "acts";
  actions.appendChild(button("add comment", async () => {
    const body = { body: area.value, author: $("author").value, whole: !span };
    if (span) Object.assign(body, { space: span.space, start: span.start, end: span.end });
    if (await act(body, "/api/comment")) clearComposer();
  }, true));
  actions.appendChild(button("cancel", clearComposer));
  box.appendChild(actions);
  area.focus();
}

function replyBox(comment) {
  const box = panel("reply to " + comment.id);
  const area = document.createElement("textarea");
  box.appendChild(area);
  const actions = document.createElement("div");
  actions.className = "acts";
  actions.appendChild(button("reply", async () => {
    if (await act({ target: comment.id, body: area.value, author: $("author").value }, "/api/reply"))
      clearComposer();
  }, true));
  actions.appendChild(button("cancel", clearComposer));
  box.appendChild(actions);
  area.focus();
}

function disposeBox(comment) {
  const box = panel("dispose " + comment.id);
  const choice = document.createElement("select");
  state.data.verdicts.forEach((verdict) => {
    const option = document.createElement("option");
    option.value = verdict;
    option.textContent = verdict;
    choice.appendChild(option);
  });
  const row = document.createElement("div");
  row.className = "row";
  row.appendChild(choice);
  box.appendChild(row);
  const area = document.createElement("textarea");
  area.placeholder = "the reason — required for every verdict";
  box.appendChild(area);
  const actions = document.createElement("div");
  actions.className = "acts";
  actions.appendChild(button("record", async () => {
    const body = { target: comment.id, verdict: choice.value, reason: area.value, author: $("author").value };
    if (await act(body, "/api/dispose")) clearComposer();
  }, true));
  actions.appendChild(button("cancel", clearComposer));
  box.appendChild(actions);
  area.focus();
}

function threadBox(comment) {
  const closing = !comment.resolved;
  const box = panel((closing ? "resolve " : "reopen ") + comment.id);
  const area = document.createElement("textarea");
  area.placeholder = closing ? "a closing note (optional)" : "why it goes back — required";
  box.appendChild(area);
  const actions = document.createElement("div");
  actions.className = "acts";
  actions.appendChild(button(closing ? "resolve" : "reopen", async () => {
    const body = {
      target: comment.id, resolved: closing, author: $("author").value, actor: $("actor").value,
    };
    if (closing) body.note = area.value; else body.reason = area.value;
    if (await act(body, "/api/thread")) clearComposer();
  }, true));
  actions.appendChild(button("cancel", clearComposer));
  box.appendChild(actions);
  area.focus();
}

// -- focus ----------------------------------------------------------------

function focus(id, origin) {
  // `origin` is which side was clicked, and it is the whole of the difference:
  // focusing has always highlighted both sides, and only ever moved one of them.
  //
  // The elements are the ones `markFocus` just found, rather than matched again
  // here — the rule for "does this mark carry this comment" is written once, in
  // the place that draws the highlight, and this reads its answer off the class.
  // That also settles the navigation bar: a card cannot be clicked before the
  // document it belongs to has been drawn, because `load` draws the document and
  // then the threads, so switching files leaves nothing stale to scroll to.
  state.focused = id;
  markFocus();
  const anchor = document.querySelector("mark.anch.here, .caret.here");
  const card = document.querySelector('.card[data-comment="' + id + '"]');
  const comment = state.data ? state.data.comments.find((c) => c.id === id) : null;
  const where = focusScroll(origin, {
    mark: !!anchor, card: !!card, orphaned: !!(comment && comment.orphaned),
  });
  // `nearest` for the card because the thread column scrolls on its own and a
  // card already in view should not jump; `center` for the anchor because an
  // anchor pinned to the top or bottom edge shows the reviewer the sentence
  // without the paragraph it has to be read against.
  if (where === "card") card.scrollIntoView({ block: "nearest" });
  else if (where === "anchor") anchor.scrollIntoView({ block: "center" });
  else if (where === "orphan") flashOrphan(card);
}

function flashOrphan(card) {
  // A click that asks "where is this?" about a comment the document lost has to
  // answer something, and the answer is the badge the card already carries. A
  // second way to say "orphaned" would leave a reviewer deciding whether the two
  // mean the same state; this only points at the word that is on screen.
  const badge = card ? card.querySelector(".tag.orphan") : null;
  if (!badge) return;
  // Dropping the class and reading the layout back before setting it again is
  // what restarts a running animation. Without it a second click during the
  // first flash is indistinguishable from a click that did nothing — which is
  // the exact reading this whole path exists to stop giving.
  badge.classList.remove("flash");
  void badge.offsetWidth;
  badge.classList.add("flash");
}

function markFocus() {
  // Cleared with the selector it is set with. Carets were being marked and never
  // unmarked, which showed as nothing while the style covered spans alone — and
  // would show as a highlight on a comment nobody is looking at the moment it
  // did not, or as the wrong place to scroll to for anything reading `here`.
  document.querySelectorAll("mark.anch.here, .caret.here").forEach((m) => m.classList.remove("here"));
  document.querySelectorAll(".card.here[data-comment]").forEach((c) => c.classList.remove("here"));
  if (!state.focused) return;
  document.querySelectorAll("mark.anch, .caret").forEach((mark) => {
    if (mark.dataset.comments.split(" ").includes(state.focused)) mark.classList.add("here");
  });
  const card = document.querySelector('.card[data-comment="' + state.focused + '"]');
  if (card) card.classList.add("here");
}

// -- raw editing → suggestion (G8) ---------------------------------------

function startEditing() {
  state.editing = true;
  $("edittext").value = state.data.base || "";
  $("editnote").textContent = "editing the text this round froze — submitting records a patch, "
    + "it does not touch the file";
  $("editor").classList.add("show");
  $("doc").style.display = "none";
}

function stopEditing() {
  state.editing = false;
  $("editor").classList.remove("show");
  $("doc").style.display = "";
}

// -- wiring ---------------------------------------------------------------

function setMode(mode) {
  state.mode = mode;
  document.querySelectorAll(".modes button").forEach((element) => {
    element.setAttribute("aria-pressed", String(element.dataset.mode === mode));
  });
  if (mode !== "raw" && state.editing) stopEditing();
  renderControls();
  draw();
}

function renderControls() {
  // A mode button is clickable before the first state has arrived.
  if (!state.data) return;
  const host = $("doc");
  const existing = $("modebar");
  if (existing) existing.remove();
  const bar = document.createElement("div");
  bar.id = "modebar";
  bar.className = "row";
  if (state.mode === "diff") {
    const label = document.createElement("label");
    label.className = "check";
    const box = document.createElement("input");
    box.type = "checkbox";
    box.id = "changesonly";
    box.addEventListener("change", draw);
    label.appendChild(box);
    label.appendChild(document.createTextNode(" changed lines only"));
    bar.appendChild(label);
    const summary = document.createElement("span");
    summary.className = "meta";
    const diff = state.data.diff;
    summary.textContent = !diff.available ? ""
      : diff.identical ? "the document is byte-identical to this round's base"
      : diff.only_terminator ? "only the trailing line break differs"
      : "+" + diff.added + " / -" + diff.removed + " against this round's base";
    bar.appendChild(summary);
  }
  if (state.mode === "raw" && state.data.commentable) {
    bar.appendChild(button("edit → suggestion", startEditing));
  }
  if (state.data.commentable) {
    bar.appendChild(button("comment on the document", () => commentBox(null)));
  }
  if (state.data.blocked) {
    const note = document.createElement("span");
    note.className = "meta";
    note.textContent = state.data.blocked;
    bar.appendChild(note);
  }
  host.parentNode.insertBefore(bar, host);
}

function placeFloat() {
  const span = selectedSpan();
  const floater = $("float");
  if (!span || !state.data || !state.data.commentable) { floater.classList.remove("show"); return; }
  const rect = window.getSelection().getRangeAt(0).getBoundingClientRect();
  floater.style.top = (window.scrollY + rect.bottom + 6) + "px";
  floater.style.left = (window.scrollX + rect.left) + "px";
  floater.classList.add("show");
}

async function load() {
  const data = await api("/api/state");
  state.data = data;
  // From here on the page names the document explicitly, including the first
  // load, where the server chose it. The header shows the workspace's name for
  // it rather than the store's: a central store keys `docs/sub/a.md` as `a.md`,
  // and a bar full of basenames would make two documents look like one.
  if (data.workspace) state.doc = data.workspace.selected;
  $("docname").textContent = data.workspace ? data.workspace.selected : data.doc;
  $("roundmeta").textContent = data.round
    ? data.round.id + " · " + data.round.status + " · base " + data.round.base.slice(7, 19)
      + (data.round.title ? " · " + data.round.title : "")
    : "no round";
  if (!$("author").value) $("author").value = data.author;
  if (data.actor) $("actor").value = data.actor;
  drawFiles();
  renderControls();
  draw();
  drawThreads();
}

document.querySelectorAll(".modes button").forEach((element) => {
  element.addEventListener("click", () => setMode(element.dataset.mode));
});
$("showresolved").addEventListener("change", drawThreads);
$("refresh").addEventListener("click", () => load().catch((e) => notice(String(e.message || e), "bad")));
$("float").addEventListener("mousedown", (event) => {
  // mousedown, not click: clicking clears the selection before the handler runs.
  event.preventDefault();
  const span = selectedSpan();
  $("float").classList.remove("show");
  if (span) commentBox(span);
});
document.addEventListener("selectionchange", placeFloat);
$("propose").addEventListener("click", async () => {
  const body = { text: $("edittext").value, body: $("editwhy").value, author: $("author").value };
  if (await act(body, "/api/suggestion")) { stopEditing(); $("editwhy").value = ""; }
});
$("editcancel").addEventListener("click", stopEditing);

load().catch((error) => notice(String(error.message || error), "bad"));
</script>
</body>
</html>
