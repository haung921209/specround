<!doctype html>
<!--
  The whole front end: one file, no build step, no network beyond this process.

  The load-bearing idea is that the server hands down text runs carrying their
  document offsets (see specround/markdown.py), so turning a selection into an
  anchor is arithmetic on `data-s` rather than a guess about what the reader
  meant. Every mode below plays by that one rule, which is why a comment made on
  the render, on the raw text, or on a diff row is the same comment (SPEC §3).
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>specround</title>
<style>
  :root {
    --bg: #fbfbfa; --panel: #fff; --ink: #1a1a19; --dim: #6b6b66; --line: #e2e1dc;
    --accent: #2f6f5e; --warn: #9a5b12; --bad: #a33; --mark: #fff3bf; --markopen: #ffe08a;
    --add: #e9f6ec; --del: #fdecec; --mono: ui-monospace, SFMono-Regular, Menlo, monospace;
    /* The two the reader moves. `--read` is the size the document and the threads
       are read at, and `--handle` is how wide a splitter is to grab — wide enough
       to hit on a trackpad, narrow enough that the seam still looks like a seam.
       Both are overwritten inline by `applyView`; these are what an unstyled
       first paint uses, and they are the layout as it always was. */
    --read: 15px; --handle: 6px;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #17181a; --panel: #1e2023; --ink: #e6e5e1; --dim: #9a9a94; --line: #33363a;
      --accent: #7fc0ac; --warn: #d99a4e; --bad: #e08a8a; --mark: #4a4423; --markopen: #6b5f22;
      --add: #1d2d22; --del: #33211f;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font: 15px/1.6 system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  header {
    position: sticky; top: 0; z-index: 5; background: var(--panel);
    border-bottom: 1px solid var(--line); padding: 8px 14px;
    display: flex; flex-wrap: wrap; gap: 10px; align-items: center;
  }
  header .doc { font-weight: 600; }
  header .meta { color: var(--dim); font-size: 13px; font-family: var(--mono); }
  /* Only when clicking it goes somewhere — a pointer over text that does
     nothing is a promise the page does not keep. */
  header .meta.goto { cursor: pointer; text-decoration: underline dotted; }
  header .grow { flex: 1; }
  .modes { display: flex; border: 1px solid var(--line); border-radius: 6px; overflow: hidden; }
  .modes button { border: 0; background: transparent; color: var(--ink); padding: 5px 12px; cursor: pointer; font: inherit; }
  .modes button[aria-pressed="true"] { background: var(--accent); color: #fff; }
  /* A mode this document has nothing for. It stays in place, greyed, with the
     reason on its title — see `diffReason`. */
  .modes button:disabled { opacity: .45; cursor: not-allowed; }
  /* The fold switches borrow the group's shape but not its fill. `aria-pressed` is
     right for them — a column showing is a state, not a step — but the accent is
     already spelling "this is the mode you are in", and a header with three filled
     buttons at rest is a header where the one that means a choice stopped standing
     out. So the state worth seeing is the unusual one: a folded column dims its
     switch, and an open one looks like the ordinary button it is. */
  #columns button[aria-pressed="true"] { background: transparent; color: var(--ink); }
  #columns button[aria-pressed="false"] { background: transparent; color: var(--dim); }
  button, select, input, textarea { font: inherit; color: var(--ink); }
  .btn {
    background: var(--panel); border: 1px solid var(--line); border-radius: 6px;
    padding: 4px 10px; cursor: pointer;
  }
  .btn.primary { background: var(--accent); color: #fff; border-color: var(--accent); }
  .btn:disabled { opacity: .5; cursor: not-allowed; }
  #notice { padding: 6px 14px; font-size: 13px; border-bottom: 1px solid var(--line); display: none; }
  #notice.show { display: block; }
  #notice.bad { background: var(--del); color: var(--bad); }
  #notice.info { background: var(--panel); color: var(--dim); }
  /* Five tracks always, and every child placed by hand into one of them. Source
     order would be enough until a column is folded away — a folded column is
     `display: none`, and auto-placement slides everything after it one track to
     the left, which puts the document where the bar was. Placing by hand means a
     folded column is a track of zero width and nothing else moves.
     The navigation bar exists only when the server was started on a directory, so
     a file view is the same layout with its first two tracks at nothing. */
  main {
    display: grid; gap: 0; align-items: start;
    grid-template-columns:
      var(--nav-w) var(--nav-handle) minmax(0, 1fr) var(--handle) var(--thr-w);
    --nav-w: 0px; --nav-handle: 0px;
    --thr-w: var(--thr-width, 380px);
  }
  main.tree { --nav-w: var(--nav-width, 260px); --nav-handle: var(--handle); }
  nav#files { grid-column: 1; }
  #splitnav { grid-column: 2; }
  #stage { grid-column: 3; min-width: 0; }
  #splitthreads { grid-column: 4; }
  aside { grid-column: 5; }
  /* A grab, not a decoration: transparent while nobody is reaching for it, so the
     panels' own borders stay the separator they have always been, and accent under
     the pointer so the seam says it can be moved. It is left in place when its
     column is folded, because dragging it out is the other way back. */
  .split {
    position: sticky; top: 49px; height: calc(100vh - 49px);
    cursor: col-resize; background: transparent; touch-action: none;
  }
  .split:hover, .split.dragging { background: var(--accent); }
  #splitnav { display: none; }
  main.tree #splitnav { display: block; }
  nav#files { display: none; }
  main.tree nav#files {
    display: block; position: sticky; top: 49px; max-height: calc(100vh - 49px);
    overflow-y: auto; border-right: 1px solid var(--line); background: var(--panel); padding: 12px;
  }
  /* Folded: gone, not squeezed. A zero-width track still holds a panel's border
     and padding open, so a column folded by width alone would leave a 25px stripe
     that looks like a rendering fault rather than a fold. These come after the
     rules that show the panels so that a fold wins wherever it is set. */
  main.navshut nav#files { display: none; }
  main.thrshut aside { display: none; }
  /* Below this the columns cannot sit side by side at all, which is the layout this
     page has always fallen back to. The handles go with them — there is nothing
     horizontal left to divide — and folding is then the whole control, which is
     the one that matters here anyway: the panels go away and the document has the
     screen. Last, so it wins over the per-handle rules above. */
  @media (max-width: 900px) {
    main, main.tree { grid-template-columns: minmax(0, 1fr); }
    nav#files, #stage, aside { grid-column: 1; }
    /* `main.tree` on the first of these is load-bearing, not symmetry: the rule
       that shows the bar's handle is `main.tree #splitnav`, and a bare `#splitnav`
       here loses to it on specificity. Measured, not guessed — it left a
       zero-width `col-resize` target sitting in a layout with no columns to
       resize, which is a handle that answers the mouse and moves nothing. */
    main.tree #splitnav, #splitthreads { display: none; }
  }
  nav#files h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .05em; color: var(--dim); margin: 0 0 8px; }
  nav#files .note { font-size: 12px; color: var(--dim); margin-top: 10px; line-height: 1.45; }
  .file {
    display: block; width: 100%; text-align: left; font: inherit; cursor: pointer;
    background: transparent; color: var(--dim); border: 0; border-left: 3px solid transparent;
    padding: 5px 7px; border-radius: 0 6px 6px 0; margin-top: 2px;
  }
  .file:hover { background: var(--bg); }
  /* Two different things, and they must not look like one: the accent edge says
     "this document has review on it", the filled row says "this is the one you
     are reading". A reviewer scanning for the first should not have to work out
     which of them the highlight means. */
  .file.active { color: var(--ink); border-left-color: var(--accent); }
  .file[aria-current="true"] { background: var(--bg); color: var(--ink); font-weight: 600; }
  .file .name { display: block; font-size: 13px; word-break: break-all; }
  .file .marks { display: block; margin-top: 3px; }
  /* The size the reader chose, and from here down every size inside the document
     is relative to it — `em` and not `px`, or a bigger document would be a bigger
     paragraph with the same small code in it. */
  #doc { padding: 18px 22px 60vh; min-width: 0; font-size: var(--read); }
  #doc h1, #doc h2, #doc h3, #doc h4 { line-height: 1.3; margin: 1.4em 0 .5em; }
  #doc h1 { font-size: 1.6em; } #doc h2 { font-size: 1.3em; } #doc h3 { font-size: 1.1em; }
  #doc pre {
    background: var(--panel); border: 1px solid var(--line); border-radius: 6px;
    padding: 10px 12px; overflow-x: auto; font-family: var(--mono); font-size: .87em;
  }
  #doc table { border-collapse: collapse; margin: 1em 0; display: block; overflow-x: auto; }
  #doc th, #doc td { border: 1px solid var(--line); padding: 4px 9px; text-align: left; }
  #doc blockquote { margin: 1em 0; padding-left: 12px; border-left: 3px solid var(--line); color: var(--dim); }
  #doc code { font-family: var(--mono); font-size: .9em; background: var(--panel); padding: 1px 4px; border-radius: 3px; }
  #doc pre code { background: none; padding: 0; }
  #doc hr { border: 0; border-top: 1px solid var(--line); margin: 1.6em 0; }
  #doc.raw, #doc.diff { font-family: var(--mono); font-size: calc(var(--read) * .87); line-height: 1.55; }
  .line { display: flex; }
  .line .ln {
    flex: 0 0 4.5ch; text-align: right; padding-right: 1.2ch; color: var(--dim);
    user-select: none; -webkit-user-select: none;
  }
  /* The gutter is a comment target, so it has to look like one — a reader who
     does not know a selection can be commented on still knows a line number can
     be clicked. Gated on `.live` because a pointer over a round that cannot take
     comments would promise a click that goes nowhere. */
  #doc.live .line .ln { cursor: pointer; }
  #doc.live .line .ln:hover { background: var(--line); color: var(--ink); }
  .line .body { white-space: pre-wrap; word-break: break-word; flex: 1; min-width: 0; }
  .line.added { background: var(--add); }
  .line.removed { background: var(--del); }
  .line .sign { flex: 0 0 2ch; color: var(--dim); user-select: none; -webkit-user-select: none; }
  mark.anch { background: var(--mark); color: inherit; border-radius: 2px; cursor: pointer; }
  mark.anch.open { background: var(--markopen); }
  .caret { color: var(--accent); font-weight: 700; cursor: pointer; }
  /* One highlight for both kinds of anchor. A run of text and an insertion point
     are the same claim about where a comment sits, and a focused caret that lit
     up nothing left the reviewer hunting for a mark the document never had. */
  mark.anch.here, .caret.here { outline: 2px solid var(--accent); }
  /* The threads take the reading size too, because a comment is read against the
     sentence it is about — one of the two at the size the reviewer set and the
     other not is the pair being harder to read together, not easier. The file bar
     keeps its own size: it is a list of names to scan, not prose to read. */
  aside {
    position: sticky; top: 49px; max-height: calc(100vh - 49px); overflow-y: auto;
    border-left: 1px solid var(--line); background: var(--panel); padding: 12px;
    font-size: var(--read);
  }
  aside h2 { font-size: .87em; text-transform: uppercase; letter-spacing: .05em; color: var(--dim); margin: 0 0 8px; }
  .card { border: 1px solid var(--line); border-radius: 8px; padding: 9px 10px; margin-bottom: 10px; background: var(--bg); }
  .card.here { border-color: var(--accent); }
  .card .who { font-size: .8em; color: var(--dim); font-family: var(--mono); }
  .card .quote {
    font-family: var(--mono); font-size: .8em; color: var(--dim);
    border-left: 2px solid var(--line); padding-left: 6px; margin: 5px 0;
    white-space: pre-wrap; word-break: break-word; max-height: 5.5em; overflow: hidden;
  }
  .card .body { white-space: pre-wrap; word-break: break-word; }
  .card pre.patch {
    font-family: var(--mono); font-size: .8em; background: var(--panel); border: 1px solid var(--line);
    border-radius: 6px; padding: 6px 8px; overflow-x: auto; margin: 6px 0;
  }
  .card .reply { border-left: 2px solid var(--line); margin: 6px 0 0 8px; padding-left: 7px; font-size: .93em; }
  /* Written where it will be read: the box takes the indent of the chain it is
     adding to, so a reviewer sees the shape of the reply before sending it. The
     accent edge is the one difference, and it says which of them is not sent. */
  .card .replybox {
    border-left: 2px solid var(--accent); margin: 6px 0 0 8px; padding-left: 7px;
  }
  .card .replybox textarea { min-height: 52px; }
  .tag {
    display: inline-block; font-size: .73em; font-family: var(--mono); border: 1px solid var(--line);
    border-radius: 10px; padding: 0 7px; margin-right: 4px; color: var(--dim);
  }
  .tag.open { color: var(--accent); border-color: var(--accent); }
  .tag.warn { color: var(--warn); border-color: var(--warn); }
  .tag.bad { color: var(--bad); border-color: var(--bad); }
  /* The badge saying itself again, for a card asked to point at a document that
     no longer holds its text. Twice and slowly: three times a second is where a
     flash stops being emphasis and starts being a hazard, and a reviewer who has
     asked not to be moved still gets the one fade. */
  @keyframes orphanflash { from { background: var(--del); } to { background: transparent; } }
  .tag.orphan.flash { animation: orphanflash .6s ease-out 2; }
  @media (prefers-reduced-motion: reduce) {
    .tag.orphan.flash { animation-iteration-count: 1; animation-duration: 1.2s; }
  }
  .acts { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 7px; }
  textarea { width: 100%; min-height: 60px; resize: vertical; padding: 6px 8px;
    border: 1px solid var(--line); border-radius: 6px; background: var(--panel); }
  input[type=text] { padding: 4px 7px; border: 1px solid var(--line); border-radius: 6px; background: var(--panel); }
  #float {
    position: absolute; display: none; z-index: 9;
    box-shadow: 0 2px 8px rgba(0,0,0,.18);
  }
  #float.show { display: block; }
  #editor { display: none; padding: 0 22px 22px; }
  #editor.show { display: block; }
  #editor textarea { min-height: 55vh; font-family: var(--mono); font-size: calc(var(--read) * .87); }
  .row { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; margin-top: 6px; }
  label.check { font-size: .87em; color: var(--dim); display: flex; gap: 5px; align-items: center; }
  .empty { color: var(--dim); font-size: .93em; }
</style>
</head>
<body>
<header>
  <span class="doc" id="docname">…</span>
  <span class="meta" id="roundmeta"></span>
  <span class="grow"></span>
  <div class="modes" id="modes" role="group" aria-label="view mode">
    <button data-mode="render" aria-pressed="true">render</button>
    <button data-mode="raw" aria-pressed="false">raw</button>
    <button data-mode="diff" aria-pressed="false">diff</button>
  </div>
  <!-- The arrangement controls. `aria-pressed` on the fold buttons means "this
       column is showing", which is what the button is a switch for; the size pair
       are ordinary buttons because a step is not a state. -->
  <div class="modes" id="columns" role="group" aria-label="columns">
    <button id="foldnav" aria-pressed="true">⇤</button>
    <button id="foldthreads" aria-pressed="true">⇥</button>
  </div>
  <div class="modes" id="size" role="group" aria-label="reading size">
    <button id="fontdown">A−</button>
    <button id="fontup">A+</button>
  </div>
  <label class="check">author <input type="text" id="author" size="12"></label>
  <label class="check">as
    <select id="actor"><option value="human">human</option><option value="agent">agent</option></select>
  </label>
  <button class="btn" id="refresh" title="re-read the ledger and the document">reload</button>
</header>
<div id="notice"></div>
<main id="layout">
  <nav id="files" aria-label="documents in this workspace"></nav>
  <div class="split" id="splitnav" role="separator" aria-orientation="vertical"
       aria-label="width of the file bar"></div>
  <div id="stage">
    <div id="doc"></div>
    <div id="editor">
      <textarea id="edittext" spellcheck="false"></textarea>
      <div class="row">
        <input type="text" id="editwhy" placeholder="why (optional)" size="40">
        <button class="btn primary" id="propose">propose as suggestion</button>
        <button class="btn" id="editcancel">cancel</button>
        <span class="meta" id="editnote"></span>
      </div>
    </div>
  </div>
  <div class="split" id="splitthreads" role="separator" aria-orientation="vertical"
       aria-label="width of the thread column"></div>
  <aside>
    <div id="composer"></div>
    <h2 id="threadhead">threads</h2>
    <label class="check"><input type="checkbox" id="showresolved"> show resolved</label>
    <div id="threads"></div>
  </aside>
</main>
<button class="btn primary" id="float">comment</button>

<script>
"use strict";
const TOKEN = new URLSearchParams(location.search).get("t") || "";
const $ = (id) => document.getElementById(id);
// `doc` is which document of a workspace the page is reading, as the workspace
// names it. It goes on every request rather than being remembered by the
// server: the process holds no selection, which is what lets two tabs on one
// port read two documents at once. Null until the first state arrives, and
// always null for a file view, where the server serves the one document it has.
// `reply` is the inline reply editors: `open` is the one card showing one, and
// `drafts` is what has been typed on any card, open or not. Two fields because
// they answer different questions — a card can hold words nobody is looking at,
// and a card can be open with nothing typed into it yet.
// `view` is how the page is arranged for whoever is reading it — column widths,
// folds, reading size. It sits beside the rest and is the one field that outlives
// the tab, because it is the one field that is nobody else's business (see
// `loadView`).
const state = {
  data: null, doc: null, mode: "render", focused: null, editing: false, activeOnly: false,
  reply: { open: null, drafts: {} }, view: null,
};

// -- transport ------------------------------------------------------------

async function api(path, body) {
  const options = {
    headers: { "X-Specround-Token": TOKEN, "Content-Type": "application/json" },
    method: body === undefined ? "GET" : "POST",
  };
  if (body !== undefined) options.body = JSON.stringify(body);
  const query = new URLSearchParams({ t: TOKEN });
  if (state.doc) query.set("doc", state.doc);
  const response = await fetch(path + "?" + query.toString(), options);
  const text = await response.text();
  let payload = null;
  try { payload = text ? JSON.parse(text) : null; } catch (e) { payload = null; }
  if (!response.ok) {
    // The server answers in the ledger's own words. Passing the message through
    // unchanged is the point: it names the fix ("open a round", "reopen it").
    throw new Error((payload && payload.error && payload.error.message) || text || response.statusText);
  }
  return payload;
}

function notice(message, kind) {
  const box = $("notice");
  box.textContent = message || "";
  box.className = message ? "show " + (kind || "info") : "";
}

async function act(body, path) {
  try {
    await api(path, body);
    notice("");
    await load();
    return true;
  } catch (error) {
    notice(String(error.message || error), "bad");
    return false;
  }
}

// -- text runs ------------------------------------------------------------
//
// One rule for all three modes: an element with `data-s` holds text that is
// verbatim document content starting at that offset, in the space named by
// `data-space` (the round's base unless it says otherwise). Everything below
// reads or writes offsets through that, and nothing else.

function holderOf(node) {
  const element = node && node.nodeType === 3 ? node.parentElement : node;
  return element && element.closest ? element.closest("[data-s]") : null;
}

function offsetIn(holder, node, offset) {
  if (node === holder || node.nodeType !== 3) {
    // A boundary landed on the element itself; the honest reading is its edge.
    return offset === 0 ? 0 : holder.textContent.length;
  }
  let seen = 0;
  const walker = document.createTreeWalker(holder, NodeFilter.SHOW_TEXT);
  let current;
  while ((current = walker.nextNode())) {
    if (current === node) return seen + offset;
    seen += current.nodeValue.length;
  }
  return seen;
}

function textIn(space) {
  // The text a span's offsets count in. One lookup for every converter below, so
  // that two of them cannot disagree about which document they are measuring.
  return (space === "base" ? state.data.base : state.data.live) || "";
}

function selectedSpan() {
  if (!state.data) return null;
  const selection = window.getSelection();
  if (!selection || selection.isCollapsed || !selection.rangeCount) return null;
  const range = selection.getRangeAt(0);
  const head = holderOf(range.startContainer);
  const tail = holderOf(range.endContainer);
  if (!head || !tail) return null;
  const space = head.dataset.space || "base";
  if ((tail.dataset.space || "base") !== space) return null;
  const start = Number(head.dataset.s) + offsetIn(head, range.startContainer, range.startOffset);
  const end = Number(tail.dataset.s) + offsetIn(tail, range.endContainer, range.endOffset);
  if (end <= start) return null;
  return { space, start, end, quote: textIn(space).slice(start, end) };
}

function commentOnLine(space, start, text) {
  // The cheap gesture: one click on a line number instead of a drag across the
  // line. It goes through the same composer and the same route a selection does,
  // so a line the revision alone has meets the refusal that was already there
  // rather than a second one written for this path.
  commentBox(spanOfRun(space, start, text, textIn(space)));
}

// -- the pure part --------------------------------------------------------
//
// These touch neither the DOM nor `state`, and the tests lift this block out and
// run it. Everything else on this page needs a browser to mean anything; this is
// the part a machine can hold to account, and the line-to-anchor conversion
// belongs in it because it is the one offset the page works out for itself
// rather than receiving from the server.

function rawLines(text) {
  // One entry per line, each carrying the offset its first character sits at.
  // A document that ends with a break has an empty line after it, and that line
  // is real: its gutter is where a reviewer says something belongs at the end.
  const out = [];
  let at = 0;
  for (;;) {
    const stop = text.indexOf("\n", at);
    const cut = stop === -1 ? text.length : stop;
    out.push({ start: at, text: text.slice(at, cut) });
    if (stop === -1) return out;
    at = stop + 1;
  }
}

function spanOfRun(space, start, text, source) {
  // A line is a whole run: `lineRow` gives every line exactly one `data-s`
  // holder, so "this line" is that holder's extent and there is nothing new to
  // measure. The quote comes off the source rather than the run for the reason
  // `selectedSpan` does the same — the offsets are the claim, and the text on
  // screen is only ever a copy of what they name. An empty line therefore yields
  // a zero-width span, which is an insertion point (§5) and not a mistake.
  const end = start + text.length;
  return { space, start, end, quote: source.slice(start, end) };
}

function modeClass(mode, commentable) {
  return commentable ? mode + " live" : mode;
}

function diffReason(data) {
  // Why the diff mode is not on offer, or "" when it is. The mode is two texts
  // compared and it needs both — the base a round froze, and the file as it is
  // now. Offering it anyway draws an empty page, which tells a reviewer less
  // than a disabled button naming the half that is missing. The two ways it goes
  // missing are different situations to be in: no round yet is where a review
  // starts, and an unreadable file is something to go and look at.
  if (!data) return "";
  if (data.diff && data.diff.available) return "";
  if (!data.round) return "no round yet — a diff needs a base to compare against";
  return "the document is not readable — a diff needs the file as it is now";
}

function readingNote(data) {
  // Which of the two texts is on screen, and how far the file has gone from it.
  // The render is the round's base while a round is open (I7) and the page said
  // so only in a `data-space` attribute — so a reviewer who had applied every
  // comment reopened the URL, met the text they started from, and had no way to
  // read that as anything but the round having failed to end. The drift is not
  // an alarm: a base the revision has moved past is what a round in progress
  // looks like. It is the silence about it that misleads.
  if (!data || !data.reading) return "";
  if (data.reading !== "base") return "reading the file — no round has frozen a base yet";
  if (data.live === null || data.live === undefined) {
    return "reading this round's base — the document is no longer on disk";
  }
  const diff = data.diff || {};
  if (!diff.available || diff.identical) return "reading this round's base — the file matches it";
  return "reading this round's base — the file is +" + diff.added + " / −" + diff.removed + " past it";
}

function settledNote(data) {
  // A finished review waiting on the record of it. Both counts at zero on an
  // open round is the answer to "is the round over?", and working it out meant
  // comparing two numbers to zero and knowing which verb moves which. A round
  // with no comments at all is not settled, it is unstarted — saying "nothing
  // outstanding" there would name a step nobody is standing in front of.
  if (!data || !data.round || data.round.status !== "open") return "";
  const counts = data.counts || {};
  if (!counts.comments) return "";
  if (counts.undisposed || counts.resolved !== counts.comments) return "";
  return "nothing outstanding — every comment disposed, every thread resolved. "
    + "End the round with 'specround round close'";
}

function roundAction(data) {
  // The one act of the review that used to send a reviewer to a terminal, and
  // what pressing it costs. The shell makes you type --allow-undisposed to walk
  // away from comments nobody decided; here the label says it, because one
  // button whose meaning depends on state the reader cannot see is the same gate
  // passed silently. `null` where there is nothing to act on — a closed round
  // over a document that is gone has no next round to start (G12: the review
  // stays readable, but a base is cut from a text and there is none).
  if (!data || !data.reading) return null;
  const counts = data.counts || {};
  if (data.round && data.round.status === "open") {
    return counts.undisposed
      ? { label: "end this round — leaves " + counts.undisposed + " undisposed",
          body: { open: false, allow_undisposed: true } }
      : { label: "end this round", body: { open: false } };
  }
  if (data.live === null || data.live === undefined) return null;
  return {
    label: data.round ? "start the next round on the revision" : "start the first round",
    body: { open: true },
  };
}

function readable(data) {
  // Whether there is a text to draw. Deliberately not "is there a round": those
  // two came apart the moment a document with no round started reading the file
  // itself, and conflating them is what put a paragraph on the page where the
  // document should have been. The only answer of "nothing" is no base *and* no
  // file, and there the server's reason is the whole page.
  return Boolean(data && data.reading);
}

function modeFor(mode, data) {
  // The mode to actually be in, which is not always the one that was up. The
  // mode outlives the document: clicking through a tree (H15) keeps it, and most
  // documents in a tree have no round — so a reviewer browsing in diff mode
  // would land on one empty page after another. The render always has something
  // to show, so that is where it falls back to.
  return mode === "diff" && diffReason(data) ? "render" : mode;
}

function visibleDocuments(documents, activeOnly) {
  // The activity filter, and the whole of it: the bar always receives the full
  // listing and hides rows here. Asking the server for a filtered list instead
  // would make the counts beside the checkbox describe a set the page cannot
  // see, and "3 of 40 reviewed" is the number that makes the toggle worth a click.
  return activeOnly ? documents.filter((entry) => entry.active) : documents;
}

function badges(entry) {
  // What a reviewer scans a file list for, in the order they scan for it. The
  // numbers are the server's; nothing is recomputed here, because a bar that
  // counted them itself would be a second oracle for a word the ledger defines.
  // A document that was reviewed and has nothing outstanding still says so —
  // "reviewed, nothing owed" and "never looked at" are different answers and a
  // blank row would give them the same one.
  //
  // The badge is the disposition axis: comments with no verdict. It used to be
  // spelled "unresolved", which is the thread axis's word — so a reviewer who
  // had just resolved a thread read this badge as the bar ignoring them.
  const out = [];
  if (entry.error) out.push({ text: "unreadable", kind: "bad" });
  if (entry.open_rounds) out.push({ text: entry.open_rounds + " open", kind: "open" });
  if (entry.undisposed) out.push({ text: entry.undisposed + " undisposed", kind: "warn" });
  if (entry.orphans) out.push({ text: entry.orphans + " orphaned", kind: "bad" });
  // The other way a comment ends up undrawable (I12), and the one nobody
  // expects — without it "0 orphaned" reads as "everything can be shown".
  if (entry.misplaced) out.push({ text: entry.misplaced + " misplaced", kind: "bad" });
  if (!out.length && entry.rounds) out.push({ text: "reviewed", kind: "" });
  return out;
}

function focusScroll(origin, present) {
  // Which side of the screen moves when a comment is focused: the side the click
  // did not come from. A reviewer who clicks a mark is reading the document and
  // wants the thread; one who clicks a card is reading the thread and wants the
  // place. Moving both takes the viewport out from under whichever one they were
  // actually reading, and in the same scroll parent the two would chase each
  // other. So this answers with exactly one, and the caller scrolls only that.
  //
  // `""` is a no-op and is an ordinary answer rather than a failure: a card can
  // be filtered out of the list, and an anchor can sit on a line the diff is
  // hiding or in a mode that does not draw it. Nothing is wrong in either case
  // and there is nowhere to go, so the page stays where the reviewer put it.
  //
  // "orphan" is the one absence worth saying out loud, and what makes it worth
  // saying is that it is the ledger's word rather than the screen's: a comment
  // the document lost is a standing fact about the review, not a mode this view
  // happens to be in. An orphan the page can still place is scrolled to like any
  // other — orphaning keeps the last good anchor rather than forgetting it (§4),
  // so there is somewhere to go, and going there beats announcing a state the
  // card is already showing.
  if (origin !== "card") return present.card ? "card" : "";
  if (present.mark) return "anchor";
  return present.orphaned ? "orphan" : "";
}

function replyAfter(reply, action) {
  // The whole rule for the inline reply editors, in one place, so that the six
  // handlers that move them cannot each hold a slightly different version of it.
  //
  // Two things are being kept true at once. At most one editor is open, because
  // two textareas with a cursor in one of them is how a reviewer answers the
  // wrong thread. And no editor closes on words it was not told to drop: the
  // one gesture that means "I do not want this" is `discard` (the cancel
  // button, and a reply that went through), while turning to another card only
  // `open`s that one and leaves the first card's half-sentence on the card it
  // was meant for. Losing a draft to a click that was about some other thread
  // is the failure this split exists to make impossible.
  //
  // `close` is that same stowing without naming a replacement — what a top
  // composer does when it takes the page's one cursor.
  const drafts = Object.assign({}, reply.drafts);
  if (action.kind === "reset") return { open: null, drafts: {} };
  if (action.kind === "open") return { open: action.id, drafts };
  if (action.kind === "close") return { open: null, drafts };
  if (action.kind === "type") {
    // An emptied box is not a draft. Otherwise a reviewer who selected their
    // words and deleted them would still be told a draft was waiting.
    if (action.text) drafts[action.id] = action.text;
    else delete drafts[action.id];
    return { open: reply.open, drafts };
  }
  if (action.kind === "discard") {
    delete drafts[action.id];
    return { open: reply.open === action.id ? null : reply.open, drafts };
  }
  // Every caller passes a literal, so an unknown kind is a typo, and a typo
  // that returned the state unchanged would look exactly like a dead button.
  throw new Error("unknown reply action: " + action.kind);
}

function replyLabel(reply, id) {
  // A draft nobody can see has to say it is there. Without this, a card whose
  // editor was stowed to open another one is indistinguishable from a card that
  // lost what was typed into it — and "it lost my words" is the reading a
  // reviewer will reach for first.
  return !reply.drafts[id] || reply.open === id ? "reply" : "reply · draft";
}

function paintable(comments) {
  // Which comments may be drawn on the base — one filter, so the marks, the
  // carets and anything that counts them cannot disagree about the answer.
  //
  // `misplaced` (I12) is the server saying the offsets were cut from some text
  // other than the base this page shows. The page cannot check that itself: it
  // holds one snapshot and no way to know which one an anchor came from. What
  // it can do is decline, and declining is the point — the alternative is not a
  // missing mark but a mark on a sentence the comment was never about, which
  // reads like a correct answer. That was measured on a real review at 12 of 17
  // comments. Nothing a reviewer needs is lost: the card still carries the
  // thread, and only the wrong claim about *where* is dropped.
  return comments.filter((c) => c.current_anchor && !c.misplaced);
}

function visibleComments(comments, showResolved) {
  // Which comments the reviewer asked to see — the answer both surfaces of this
  // page take, the cards in the thread column and the marks in the document.
  //
  // Separate from `paintable` because the two are different questions. That one
  // is about what the document *can* draw and only the marks answer to it; this
  // one is about what has been asked for, and a thread that is not on the
  // screen must not be on the page anywhere else either. They were filtered
  // apart — the column dropped a resolved thread and the document painted its
  // anchor regardless — and what that leaves behind is worse than an extra
  // colour: the mark is still a click target, the click focuses a comment there
  // is no card for, and a door that opens onto nothing reads as the tool having
  // lost the thread rather than as the tool hiding it.
  //
  // Resolving is the ordinary way a thread leaves the screen and the toggle is
  // the way back, so both directions have to reach both surfaces. One filter is
  // how that stays true: a second spelling of it is a rule that can be
  // half-changed, which is exactly how this got here.
  return comments.filter((c) => showResolved || !c.resolved);
}

// -- how the page is arranged ---------------------------------------------
//
// Column widths, whether a column is folded away, and the size the text is read
// at. All of it is one object, two conversions and a clamp — and every way it
// actually breaks (a stored blob from a version that wrote fewer keys, a
// hand-edited value, a drag that ran off the screen) is arithmetic, which is why
// it belongs on this side of the fence rather than in the handlers.

const VIEW_KEY = "specround.view";

// The layout as it has always looked, and the bounds a drag may not leave. The
// floors are not taste: a bar narrower than the badges it lists, or a thread
// column narrower than a card, is a column that has been folded without saying
// so — and folding is a button, with a way back. A ceiling for the same reason
// with the document on the losing side.
const VIEW_DEFAULTS = { nav: 260, threads: 380, font: 15 };
const VIEW_BOUNDS = { nav: [140, 560], threads: [240, 760], font: [11, 26] };

// Under this the three columns stop fitting: 260 and 380 of chrome leave a
// document about as wide as the bar beside it, which is the complaint this was
// built for (a browser pane in a terminal multiplexer, 2026-08-08). So a narrow
// viewport *starts* folded — and starting is all this number does. It is a
// default and never a clamp: a reviewer who opens a column at this width has
// said what they want, and from then on the stored answer outranks the guess.
// Everything else about a small screen is H16's.
const VIEW_FOLD_UNDER = 1100;

function clampView(field, value) {
  // Out of bounds and not a number are one case on purpose. A stored `"260px"`,
  // a `null` from a half-written blob and a drag that reached the far edge of
  // the screen all have the same honest answer — the nearest width this layout
  // can actually be — and a page that refused to draw over any of them would be
  // a page one bad character in localStorage can break.
  const bounds = VIEW_BOUNDS[field];
  if (!bounds) throw new Error("unknown view field: " + field);
  const number = Math.round(Number(value));
  if (!Number.isFinite(number)) return VIEW_DEFAULTS[field];
  return Math.max(bounds[0], Math.min(bounds[1], number));
}

function foldDefaults(viewport) {
  // What a viewport this wide starts as, before anything stored is consulted.
  return { navShut: Number(viewport) < VIEW_FOLD_UNDER, threadsShut: Number(viewport) < VIEW_FOLD_UNDER };
}

function mergeView(stored, viewport) {
  // Field by field rather than wholesale, because the two ways a stored blob
  // goes wrong are an older page that wrote fewer keys and one nonsense value
  // in an otherwise good object — and neither is a reason to throw away the
  // rest of what the reviewer set up.
  //
  // The folds read `typeof === "boolean"` rather than falling back on truthiness
  // for the one reason that matters here: `false` is an answer. A reviewer who
  // opened a column on a narrow screen stored exactly that, and a `||` would
  // hand it back the width-based guess every time the page loaded.
  const held = stored && typeof stored === "object" ? stored : {};
  const folds = foldDefaults(viewport);
  const width = (field) => clampView(field, held[field] === undefined ? VIEW_DEFAULTS[field] : held[field]);
  return {
    nav: width("nav"),
    threads: width("threads"),
    font: width("font"),
    navShut: typeof held.navShut === "boolean" ? held.navShut : folds.navShut,
    threadsShut: typeof held.threadsShut === "boolean" ? held.threadsShut : folds.threadsShut,
  };
}

function readView(text, viewport) {
  // Whatever is under the key, which is text this page wrote last time and also
  // text anything else could have put there. Unparseable is not an error to
  // report — there is nobody to report it to, and the default layout is a
  // perfectly good answer to give a reviewer who only wanted to read.
  let stored = null;
  try { stored = text ? JSON.parse(text) : null; } catch (error) { stored = null; }
  return mergeView(stored, viewport);
}

function writeView(view) {
  // The five keys and nothing else, so that a blob which arrived carrying
  // something extra does not get handed its own additions back. This page is
  // the only writer of this key, and what it writes is what it reads.
  return JSON.stringify({
    nav: view.nav, threads: view.threads, font: view.font,
    navShut: view.navShut, threadsShut: view.threadsShut,
  });
}

function viewAfter(view, action) {
  // One place for every gesture that rearranges the page, for the reason
  // `replyAfter` has one: two splitters, two fold buttons and two size buttons
  // are six handlers, and six copies of "clamp it and keep the rest" is six
  // chances for one of them to be slightly different.
  if (action.kind === "size" || action.kind === "reset") {
    // A drag or a double-click on a handle is a statement about a width, and a
    // width says "show me this much" — so both of them unfold the column they
    // are about. Otherwise dragging a folded column's handle would move a
    // number nobody can see, which reads as a dead handle.
    const next = Object.assign({}, view);
    next[action.field] = action.kind === "reset"
      ? VIEW_DEFAULTS[action.field]
      : clampView(action.field, action.px);
    next[action.field + "Shut"] = false;
    return next;
  }
  if (action.kind === "fold") {
    const key = action.field + "Shut";
    // The width is left alone, so unfolding gives back the column that was
    // folded rather than the one it started as.
    return Object.assign({}, view, { [key]: !view[key] });
  }
  if (action.kind === "font") {
    return Object.assign({}, view, { font: clampView("font", view.font + action.step) });
  }
  // Every caller passes a literal, so an unknown kind is a typo — and a typo
  // that returned the state unchanged would look exactly like a dead button.
  throw new Error("unknown view action: " + action.kind);
}

// A picture in a document is a relative path — `img/shot.png` — and the browser
// resolves that against this page's address, which drops the query the token
// rides in. So an image is pointed at the asset route instead, with the token
// and the document (which is what the reference counts from) spelled out.
//
// Doing it here and not in the renderer is deliberate: the renderer turns one
// document into HTML and knows nothing about which view is showing it, and a
// token baked into rendered markup would be a token in something the server
// caches.
//
// `null` means leave the reference exactly as written — an `https://` image, a
// `data:` URI, a protocol-relative `//host/x.png` all address something this
// process does not serve and has no business rewriting. A root-relative
// `/x.png` is *not* one of those: it goes to the route like the rest and comes
// back with the reason it cannot be served, which beats a bare 403 from a
// request that never carried a token.
//
// Named rather than spelled inline so the route stays visible to the test that
// holds the page and the server to the same list of routes.
const ASSET_ROUTE = "/api/asset";

function assetUrl(ref, doc, token) {
  if (!ref || ref.startsWith("//") || /^[a-zA-Z][a-zA-Z0-9+.-]*:/.test(ref)) return null;
  const query = new URLSearchParams({ t: token, path: ref });
  if (doc) query.set("doc", doc);
  return ASSET_ROUTE + "?" + query.toString();
}

// -- end of the pure part -------------------------------------------------

function shownComments() {
  // The set this page is showing, and the one reading of the checkbox that
  // decides it. Both halves come through here rather than each asking the box
  // themselves: the rule lives in `visibleComments`, and this is the single
  // place the rule meets the control, so the column and the document cannot end
  // up answering to two different readings of the same tick.
  return visibleComments(state.data.comments, $("showresolved").checked);
}

// -- painting anchors ------------------------------------------------------

function paint(container, comments) {
  const anchored = paintable(comments);
  container.querySelectorAll("[data-s]").forEach((element) => {
    if ((element.dataset.space || "base") !== "base") return;
    const start = Number(element.dataset.s);
    const text = element.textContent;
    const end = start + text.length;
    const spans = anchored.filter((c) => c.current_anchor.start < end && c.current_anchor.end > start);
    const points = anchored.filter(
      (c) => c.current_anchor.start === c.current_anchor.end
          && c.current_anchor.start >= start && c.current_anchor.start <= end
    );
    if (!spans.length && !points.length) return;
    const clamp = (at) => Math.max(0, Math.min(text.length, at - start));
    const cuts = new Set([0, text.length]);
    spans.forEach((c) => { cuts.add(clamp(c.current_anchor.start)); cuts.add(clamp(c.current_anchor.end)); });
    points.forEach((c) => cuts.add(clamp(c.current_anchor.start)));
    const ordered = [...cuts].sort((a, b) => a - b);
    const fragment = document.createDocumentFragment();
    const caretsAt = (at) => points.filter((c) => clamp(c.current_anchor.start) === at);
    for (let index = 0; index < ordered.length; index += 1) {
      const at = ordered[index];
      caretsAt(at).forEach((c) => fragment.appendChild(caret(c)));
      const next = ordered[index + 1];
      if (next === undefined || next === at) continue;
      const piece = text.slice(at, next);
      const covering = spans.filter(
        (c) => clamp(c.current_anchor.start) <= at && clamp(c.current_anchor.end) >= next
      );
      if (!covering.length) { fragment.appendChild(document.createTextNode(piece)); continue; }
      const mark = document.createElement("mark");
      mark.className = "anch" + (covering.some((c) => !c.settled) ? " open" : "");
      mark.dataset.comments = covering.map((c) => c.id).join(" ");
      mark.textContent = piece;
      fragment.appendChild(mark);
    }
    element.textContent = "";
    element.appendChild(fragment);
  });
  container.querySelectorAll("mark.anch, .caret").forEach((mark) => {
    mark.addEventListener("click", (event) => {
      event.stopPropagation();
      focus(mark.dataset.comments.split(" ")[0], "mark");
    });
  });
}

function caret(comment) {
  const element = document.createElement("span");
  element.className = "caret";
  element.dataset.comments = comment.id;
  element.textContent = "‸";
  element.title = "insertion point — " + comment.id;
  return element;
}

// -- the three modes ------------------------------------------------------

function drawRender(host, data) {
  host.className = "";
  host.innerHTML = data.render;
  linkAssets(host, data);
}

// Every `<img>` the render produced, pointed at the asset route. The decision
// of which ones is `assetUrl`, up in the pure part; what is left here is the
// walk over the DOM.
function linkAssets(host, data) {
  host.querySelectorAll("img[src]").forEach((image) => {
    const url = assetUrl(image.getAttribute("src"),
                         data.workspace ? data.workspace.selected : null, TOKEN);
    if (url) image.setAttribute("src", url);
  });
}

function drawRaw(host, data) {
  host.className = modeClass("raw", data.commentable);
  host.textContent = "";
  // The space the server says it is reading, not `base` by assumption: with no
  // round the text is the live file, and an offset is only meaningful in the text
  // it was counted in. Through `textIn` for the same reason every other converter
  // goes through it — two of them measuring different documents is the bug this
  // page cannot afford.
  const space = data.reading;
  rawLines(textIn(space)).forEach((line, index) => {
    host.appendChild(lineRow(String(index + 1), "", line.text, line.start, space, ""));
  });
}

function drawDiff(host, data) {
  host.className = modeClass("diff", data.commentable);
  host.textContent = "";
  const diff = data.diff;
  if (!diff.available) {
    // The mode button is disabled for exactly this, so getting here means
    // something reached `draw` past it. The sentence comes off the same function
    // the button's reason does — two wordings for one situation is two answers.
    host.innerHTML = '<p class="empty">' + escapeHtml(diffReason(data)) + "</p>";
    return;
  }
  const only = $("changesonly") && $("changesonly").checked;
  diff.rows.forEach((row) => {
    if (only && row.op === "same") return;
    const sign = row.op === "added" ? "+" : row.op === "removed" ? "-" : " ";
    const space = row.op === "added" ? "revision" : "base";
    const start = row.op === "added" ? row.live_start : row.base_start;
    host.appendChild(
      lineRow(row.base_line ? String(row.base_line) : "", row.live_line ? String(row.live_line) : "",
              row.text, start, space, row.op, sign)
    );
  });
  if (!host.children.length) {
    host.innerHTML = '<p class="empty">Nothing changed since this round froze the document.</p>';
  }
}

function lineRow(left, right, text, start, space, cls, sign) {
  const line = document.createElement("div");
  line.className = "line" + (cls ? " " + cls : "");
  const gutters = [];
  const gutterLeft = document.createElement("span");
  gutterLeft.className = "ln";
  gutterLeft.textContent = left;
  gutters.push(gutterLeft);
  line.appendChild(gutterLeft);
  if (right !== "" || sign !== undefined) {
    const gutterRight = document.createElement("span");
    gutterRight.className = "ln";
    gutterRight.textContent = right;
    gutters.push(gutterRight);
    line.appendChild(gutterRight);
  }
  if (sign !== undefined) {
    const marker = document.createElement("span");
    marker.className = "sign";
    marker.textContent = sign;
    line.appendChild(marker);
  }
  const body = document.createElement("span");
  body.className = "body t";
  body.dataset.s = String(start);
  body.dataset.space = space;
  body.textContent = text;
  line.appendChild(body);
  // Both numbers act on the row they number: a diff row is one text in one space,
  // whichever side of the gutter counted it. Wired only where a comment can be
  // recorded, off the same reading of the state that puts `.live` on the host —
  // one rule, one place. If the round closes under a page that is still open the
  // click posts anyway and the ledger refuses it in its own words; a check here
  // would be a second oracle for a rule this page does not own.
  //
  // The text is captured rather than read back off the element, because by the
  // time anyone clicks, `paint` may have inserted a caret into it — the offsets
  // are the record of what this line is, and the DOM is not.
  if (state.data && state.data.commentable) {
    gutters.forEach((gutter) => {
      gutter.title = "comment on this line";
      gutter.addEventListener("click", () => commentOnLine(space, start, text));
    });
  }
  return line;
}

function draw() {
  const data = state.data;
  const host = $("doc");
  // Same race `renderControls` names: a mode button is clickable before the first
  // state has arrived.
  if (!data) return;
  // Gated on having a text to show, not on having a round — see `readable`. With
  // no round there is nothing to write and still something to read, and this is
  // where the second half used to be thrown away.
  if (!readable(data)) {
    host.className = "";
    host.innerHTML = '<p class="empty">' + escapeHtml(data.blocked || "nothing to show") + "</p>";
    return;
  }
  if (state.mode === "raw") drawRaw(host, data);
  else if (state.mode === "diff") drawDiff(host, data);
  else drawRender(host, data);
  // The showing set and not every comment: a mark for a thread the column is
  // hiding has nothing behind it to open.
  paint(host, shownComments());
  if (state.focused) markFocus();
}

// -- the workspace bar ----------------------------------------------------
//
// Navigation and nothing else. Clicking a file re-asks the server for that
// document and everything below this point redraws from the answer — there is
// no per-document state here to keep in step, which is why switching documents
// cannot leave a comment pointed at the wrong one.

function drawFiles() {
  const workspace = state.data.workspace;
  // `classList` and not `className`: the folds are classes on this same element,
  // and assigning the whole attribute unfolded both columns every time the file
  // list redrew — which is every reload.
  $("layout").classList.toggle("tree", Boolean(workspace));
  // A file view has no bar, so the button that folds it is a switch for nothing.
  $("foldnav").hidden = !workspace;
  const host = $("files");
  host.textContent = "";
  if (!workspace) return;
  const shown = visibleDocuments(workspace.documents, state.activeOnly);
  const head = document.createElement("h2");
  head.textContent = "documents — " + workspace.counts.active + " of "
    + workspace.counts.documents + " reviewed";
  host.appendChild(head);
  const filter = document.createElement("label");
  filter.className = "check";
  const box = document.createElement("input");
  box.type = "checkbox";
  box.checked = state.activeOnly;
  box.addEventListener("change", () => { state.activeOnly = box.checked; drawFiles(); });
  filter.appendChild(box);
  filter.appendChild(document.createTextNode(" with review activity only"));
  host.appendChild(filter);
  shown.forEach((entry) => host.appendChild(fileRow(entry, workspace.selected)));
  const notes = [];
  if (!shown.length) notes.push("No document here has been reviewed yet. Untick to see them all.");
  else if (shown.length < workspace.documents.length) {
    notes.push((workspace.documents.length - shown.length) + " with no review activity, hidden by the filter.");
  }
  // The server's own note about what it held back. Passed through rather than
  // reworded: a bar that showed a shorter tree without saying so would read as
  // "this is the whole tree", which is the one thing it must never imply.
  if (workspace.note) notes.push(workspace.note + ".");
  if (notes.length) {
    const note = document.createElement("p");
    note.className = "note";
    note.textContent = notes.join(" ");
    host.appendChild(note);
  }
}

function fileRow(entry, selected) {
  const element = document.createElement("button");
  element.type = "button";
  element.className = "file" + (entry.active ? " active" : "");
  element.setAttribute("aria-current", String(entry.key === selected));
  element.title = entry.error
    || (entry.last_activity ? "last activity " + entry.last_activity : "no review here yet");
  const name = document.createElement("span");
  name.className = "name";
  name.textContent = entry.key;
  element.appendChild(name);
  const marks = badges(entry);
  if (marks.length) {
    const row = document.createElement("span");
    row.className = "marks";
    row.innerHTML = marks.map((mark) => tag(mark.text, mark.kind)).join("");
    element.appendChild(row);
  }
  element.addEventListener("click", () => openDocument(entry.key));
  return element;
}

function openDocument(key) {
  // Everything the old document put on screen goes with it. A composer left
  // open would post its comment against whichever document answered next, and
  // a focused thread id means nothing on a ledger that never saw it. Drafts go
  // too, for the same reason and not as a tidy-up: they are addressed to
  // comment ids this document does not have, so keeping them would only mean
  // offering them back on whatever card happened to share an id.
  if (key === state.doc) return;
  state.doc = key;
  state.focused = null;
  state.reply = replyAfter(state.reply, { kind: "reset" });
  clearComposer();
  if (state.editing) stopEditing();
  notice("");
  load().catch((error) => notice(String(error.message || error), "bad"));
}

// -- threads --------------------------------------------------------------

function tag(text, kind) {
  return '<span class="tag ' + (kind || "") + '">' + escapeHtml(text) + "</span>";
}

function escapeHtml(text) {
  return String(text).replace(/[&<>]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" }[c]));
}

function anchorLabel(comment) {
  const anchor = comment.current_anchor;
  if (!anchor) return "(the whole document)";
  if (anchor.start === anchor.end) return "(insertion point at " + anchor.start + ")";
  return anchor.exact;
}

function drawThreads() {
  const data = state.data;
  // The same race `draw` and `renderControls` name, reached by the checkbox
  // that sits above this column: it is in the markup, so it is tickable before
  // the first state has arrived, and reading the comments off nothing throws
  // inside the handler rather than drawing an empty column.
  if (!data) return;
  const shown = shownComments();
  // What the toggle left out, taken off the filter rather than counted again.
  // A second count of the same rule is a second rule, and this heading is where
  // a reviewer would look to find out that anything is being withheld at all.
  const hidden = data.comments.length - shown.length;
  $("threadhead").textContent =
    "threads — " + shown.length + " shown, " + data.counts.undisposed + " undisposed"
    + (hidden ? ", " + hidden + " resolved and hidden" : "");
  const host = $("threads");
  host.textContent = "";
  if (!shown.length) {
    host.innerHTML = '<p class="empty">'
      + (hidden ? hidden + " resolved thread(s), hidden by default — tick the box above."
                : "No comments yet. Select text in any mode, or click a line "
                  + "number in raw or diff, to leave one.")
      + "</p>";
    return;
  }
  shown.forEach((comment) => host.appendChild(card(comment)));
}

function card(comment) {
  const element = document.createElement("div");
  element.className = "card" + (state.focused === comment.id ? " here" : "");
  element.dataset.comment = comment.id;
  // "open" is this surface's word for a comment nobody has ruled on. The wire
  // sends `verdict: null` and lets each reader spell that itself, so the accent
  // asks the settled question directly instead of reading it back out of a
  // string that had both answers packed into it.
  const tags = [tag(comment.kind), tag(comment.verdict || "open", comment.settled ? "" : "open")];
  if (comment.resolved) tags.push(tag("resolved"));
  // `orphan` beside `bad` names what the badge is rather than how it looks, so
  // the one place that draws attention to it has something to aim at that will
  // not move when the colour does.
  if (comment.orphaned) tags.push(tag("orphaned", "bad orphan"));
  // Not drawn, and saying so. An undrawn mark with no badge is indistinguishable
  // from one that is simply scrolled out of view, which would leave the reviewer
  // to discover by absence that the tool is withholding a placement.
  if (comment.misplaced) tags.push(tag("misplaced", "bad orphan"));
  if (comment.strategy === "fuzzy") tags.push(tag("fuzzy", "warn"));
  if (comment.ambiguous) tags.push(tag("ambiguous", "warn"));
  if (comment.ext && comment.ext.view) tags.push(tag("from " + comment.ext.view.space));
  element.innerHTML =
    '<div class="who">' + escapeHtml(comment.id) + " · " + escapeHtml(comment.author)
      + " · " + escapeHtml(comment.ts) + "</div>"
    + "<div>" + tags.join("") + "</div>"
    + '<div class="quote">' + escapeHtml(anchorLabel(comment)) + "</div>"
    + (comment.body ? '<div class="body">' + escapeHtml(comment.body) + "</div>" : "")
    + (comment.patch ? '<pre class="patch">' + escapeHtml(comment.patch) + "</pre>" : "")
    + '<div class="replies">'
    + comment.replies.map((reply) =>
        '<div class="reply"><span class="who">' + escapeHtml(reply.author) + "</span> "
        + escapeHtml(reply.body) + "</div>").join("")
    + "</div>"
    + (comment.dispositions.length
        ? '<div class="who">' + comment.dispositions.map((d) =>
            escapeHtml(d.verdict + " — " + d.reason)).join("<br>") + "</div>"
        : "");

  // The editor goes at the end of the chain it is adding to, which is where the
  // reply it produces will appear once the ledger has it. Answering a thread and
  // reading the answer back are then the same place on the screen.
  if (state.reply.open === comment.id) {
    element.querySelector(".replies").appendChild(replyEditor(comment));
  }

  const actions = document.createElement("div");
  actions.className = "acts";
  actions.appendChild(button(replyLabel(state.reply, comment.id), () => openReply(comment.id)));
  // A settled comment keeps the button, under the name of what pressing it now
  // does. Hiding it was the view's way of enforcing I5, which meant a verdict
  // recorded by a slip could only be undone from a shell — and a gate you can
  // only pass somewhere else is a gate people route around.
  actions.appendChild(button(comment.settled ? "supersede" : "dispose", () => disposeBox(comment)));
  actions.appendChild(button(comment.resolved ? "reopen" : "resolve", () => threadBox(comment)));
  element.appendChild(actions);
  element.addEventListener("click", () => focus(comment.id, "card"));
  return element;
}

function button(label, onClick, primary) {
  const element = document.createElement("button");
  element.className = "btn" + (primary ? " primary" : "");
  element.textContent = label;
  element.addEventListener("click", (event) => { event.stopPropagation(); onClick(); });
  return element;
}

// -- composers ------------------------------------------------------------

function clearComposer() {
  $("composer").textContent = "";
}

function panel(title) {
  // The page has one cursor, and this is the other half of the rule `openReply`
  // keeps: a composer opening at the top stows whichever card was holding it.
  // The draft stays on its card — nothing here was a decision about that reply.
  if (state.reply.open) {
    state.reply = replyAfter(state.reply, { kind: "close" });
    drawThreads();
  }
  const host = $("composer");
  host.textContent = "";
  const box = document.createElement("div");
  box.className = "card here";
  const head = document.createElement("div");
  head.className = "who";
  head.textContent = title;
  box.appendChild(head);
  host.appendChild(box);
  return box;
}

function commentBox(span) {
  const box = panel(span ? "comment on the selection" : "comment on the whole document");
  if (span) {
    const quote = document.createElement("div");
    quote.className = "quote";
    quote.textContent = span.quote;
    box.appendChild(quote);
    if (span.space === "revision") {
      const note = document.createElement("div");
      note.className = "who";
      note.textContent = "selected in the revision — it will be carried into the round's base";
      box.appendChild(note);
    }
  }
  const area = document.createElement("textarea");
  area.placeholder = "what is wrong with this, or what it should say";
  box.appendChild(area);
  const actions = document.createElement("div");
  actions.className = "acts";
  actions.appendChild(button("add comment", async () => {
    const body = { body: area.value, author: $("author").value, whole: !span };
    if (span) Object.assign(body, { space: span.space, start: span.start, end: span.end });
    if (await act(body, "/api/comment")) clearComposer();
  }, true));
  actions.appendChild(button("cancel", clearComposer));
  box.appendChild(actions);
  area.focus();
}

// -- replying, in the card ------------------------------------------------

function openReply(id) {
  // Already open is a click on the button that is already showing what it asks
  // for, so it puts the cursor back rather than rebuilding the box — redrawing
  // would restore the text but not where the reviewer was in it.
  if (state.reply.open === id) return focusReply();
  // The page has one cursor. A top composer standing open while a card takes it
  // is the same two-boxes confusion as two open cards.
  clearComposer();
  state.reply = replyAfter(state.reply, { kind: "open", id });
  drawThreads();
  focusReply();
}

function focusReply() {
  const area = document.querySelector(".card .replybox textarea");
  if (!area) return;
  // Focus without the scroll it would otherwise do, then ask for the smallest
  // move that puts the box on screen — the same `nearest` the thread column
  // uses, and for the same reason: a box already in view must not jump, and the
  // reviewer's place in whatever they were reading is not this click's to take.
  area.focus({ preventScroll: true });
  area.scrollIntoView({ block: "nearest" });
}

function replyEditor(comment) {
  const box = document.createElement("div");
  box.className = "replybox";
  const area = document.createElement("textarea");
  area.placeholder = "reply to " + comment.id;
  area.value = state.reply.drafts[comment.id] || "";
  // Every keystroke goes to the state as well as the box, because the box does
  // not survive a redraw and the words in it have to.
  area.addEventListener("input", () => {
    state.reply = replyAfter(state.reply, { kind: "type", id: comment.id, text: area.value });
  });
  box.appendChild(area);
  const actions = document.createElement("div");
  actions.className = "acts";
  actions.appendChild(button("reply", () => sendReply(comment, area.value), true));
  actions.appendChild(button("cancel", () => {
    state.reply = replyAfter(state.reply, { kind: "discard", id: comment.id });
    drawThreads();
  }));
  box.appendChild(actions);
  // The card is a click target for focusing the thread; typing in it is not
  // that click, and a caret placed with the mouse must not be dragged elsewhere.
  box.addEventListener("click", (event) => event.stopPropagation());
  return box;
}

async function sendReply(comment, body) {
  // Closed before the request, not after: a reply that lands makes `act` redraw
  // the threads, and a redraw that still saw this card as open would rebuild the
  // editor around the words it had just sent. Only the refusal path puts it back
  // — and there the screen was never redrawn, so what goes back is the state
  // agreeing with a box that is still open with its text in it.
  //
  // The refusal that matters is a resolved thread's (I11): the server names the
  // fix, `act` shows it, and the draft is still there to send once the thread is
  // reopened.
  state.reply = replyAfter(state.reply, { kind: "discard", id: comment.id });
  const sent = await act({ target: comment.id, body, author: $("author").value }, "/api/reply");
  if (sent) return;
  state.reply = replyAfter(state.reply, { kind: "open", id: comment.id });
  state.reply = replyAfter(state.reply, { kind: "type", id: comment.id, text: body });
}

function disposeBox(comment) {
  // On a settled comment this box overturns a decision instead of making one,
  // and the ledger wants that said out loud (I5). The flag is derived from the
  // state the page is already showing rather than offered as a checkbox: the
  // reviewer picked this comment knowing it had a verdict, and a second control
  // asking them to confirm what the button already said is a step to click
  // through rather than a gate to pass.
  const overturning = comment.settled;
  const box = panel((overturning ? "supersede " : "dispose ") + comment.id);
  if (overturning) {
    const note = document.createElement("div");
    note.className = "who";
    note.textContent = "already " + comment.verdict + " — recording another verdict overturns it";
    box.appendChild(note);
  }
  const choice = document.createElement("select");
  state.data.verdicts.forEach((verdict) => {
    const option = document.createElement("option");
    option.value = verdict;
    option.textContent = verdict;
    choice.appendChild(option);
  });
  const row = document.createElement("div");
  row.className = "row";
  row.appendChild(choice);
  box.appendChild(row);
  const area = document.createElement("textarea");
  area.placeholder = "the reason — required for every verdict";
  box.appendChild(area);
  const actions = document.createElement("div");
  actions.className = "acts";
  actions.appendChild(button("record", async () => {
    const body = {
      target: comment.id, verdict: choice.value, reason: area.value,
      author: $("author").value, supersede: overturning,
    };
    if (await act(body, "/api/dispose")) clearComposer();
  }, true));
  actions.appendChild(button("cancel", clearComposer));
  box.appendChild(actions);
  area.focus();
}

function threadBox(comment) {
  const closing = !comment.resolved;
  const box = panel((closing ? "resolve " : "reopen ") + comment.id);
  const area = document.createElement("textarea");
  area.placeholder = closing ? "a closing note (optional)" : "why it goes back — required";
  box.appendChild(area);
  const actions = document.createElement("div");
  actions.className = "acts";
  actions.appendChild(button(closing ? "resolve" : "reopen", async () => {
    const body = {
      target: comment.id, resolved: closing, author: $("author").value, actor: $("actor").value,
    };
    if (closing) body.note = area.value; else body.reason = area.value;
    if (await act(body, "/api/thread")) clearComposer();
  }, true));
  actions.appendChild(button("cancel", clearComposer));
  box.appendChild(actions);
  area.focus();
}

// -- focus ----------------------------------------------------------------

function focus(id, origin) {
  // `origin` is which side was clicked, and it is the whole of the difference:
  // focusing has always highlighted both sides, and only ever moved one of them.
  //
  // The elements are the ones `markFocus` just found, rather than matched again
  // here — the rule for "does this mark carry this comment" is written once, in
  // the place that draws the highlight, and this reads its answer off the class.
  // That also settles the navigation bar: a card cannot be clicked before the
  // document it belongs to has been drawn, because `load` draws the document and
  // then the threads, so switching files leaves nothing stale to scroll to.
  state.focused = id;
  markFocus();
  const anchor = document.querySelector("mark.anch.here, .caret.here");
  const card = document.querySelector('.card[data-comment="' + id + '"]');
  const comment = state.data ? state.data.comments.find((c) => c.id === id) : null;
  const where = focusScroll(origin, {
    mark: !!anchor, card: !!card, orphaned: !!(comment && comment.orphaned),
  });
  // `nearest` for the card because the thread column scrolls on its own and a
  // card already in view should not jump; `center` for the anchor because an
  // anchor pinned to the top or bottom edge shows the reviewer the sentence
  // without the paragraph it has to be read against.
  if (where === "card") card.scrollIntoView({ block: "nearest" });
  else if (where === "anchor") anchor.scrollIntoView({ block: "center" });
  else if (where === "orphan") flashOrphan(card);
}

function flashOrphan(card) {
  // A click that asks "where is this?" about a comment the document lost has to
  // answer something, and the answer is the badge the card already carries. A
  // second way to say "orphaned" would leave a reviewer deciding whether the two
  // mean the same state; this only points at the word that is on screen.
  const badge = card ? card.querySelector(".tag.orphan") : null;
  if (!badge) return;
  // Dropping the class and reading the layout back before setting it again is
  // what restarts a running animation. Without it a second click during the
  // first flash is indistinguishable from a click that did nothing — which is
  // the exact reading this whole path exists to stop giving.
  badge.classList.remove("flash");
  void badge.offsetWidth;
  badge.classList.add("flash");
}

function markFocus() {
  // Cleared with the selector it is set with. Carets were being marked and never
  // unmarked, which showed as nothing while the style covered spans alone — and
  // would show as a highlight on a comment nobody is looking at the moment it
  // did not, or as the wrong place to scroll to for anything reading `here`.
  document.querySelectorAll("mark.anch.here, .caret.here").forEach((m) => m.classList.remove("here"));
  document.querySelectorAll(".card.here[data-comment]").forEach((c) => c.classList.remove("here"));
  if (!state.focused) return;
  document.querySelectorAll("mark.anch, .caret").forEach((mark) => {
    if (mark.dataset.comments.split(" ").includes(state.focused)) mark.classList.add("here");
  });
  const card = document.querySelector('.card[data-comment="' + state.focused + '"]');
  if (card) card.classList.add("here");
}

// -- raw editing → suggestion (G8) ---------------------------------------

function startEditing() {
  state.editing = true;
  $("edittext").value = state.data.base || "";
  $("editnote").textContent = "editing the text this round froze — submitting records a patch, "
    + "it does not touch the file";
  $("editor").classList.add("show");
  $("doc").style.display = "none";
}

function stopEditing() {
  state.editing = false;
  $("editor").classList.remove("show");
  $("doc").style.display = "";
}

// -- the arrangement, on the screen ---------------------------------------

function applyView() {
  // Everything the settings mean on screen, in one pass. One function rather than
  // one per control, so that a fold restored on load and a fold set by a click
  // cannot arrive by two routes that disagree about what folded looks like.
  const layout = $("layout");
  // The fold is a zero-width track *and* a hidden panel. The width alone would
  // leave the panel's border and padding holding a stripe open; the class alone
  // would leave the track it used to fill as a gap.
  layout.style.setProperty("--nav-width", (state.view.navShut ? 0 : state.view.nav) + "px");
  layout.style.setProperty("--thr-width", (state.view.threadsShut ? 0 : state.view.threads) + "px");
  layout.classList.toggle("navshut", state.view.navShut);
  layout.classList.toggle("thrshut", state.view.threadsShut);
  document.documentElement.style.setProperty("--read", state.view.font + "px");
  foldButton("foldnav", state.view.navShut, "the file bar");
  foldButton("foldthreads", state.view.threadsShut, "the thread column");
  // The size is on the buttons rather than in a readout of its own: a number that
  // only matters while it is being changed does not need a place in the header.
  $("fontdown").title = "smaller — now " + state.view.font + "px";
  $("fontup").title = "larger — now " + state.view.font + "px";
}

function foldButton(id, shut, what) {
  const element = $(id);
  element.setAttribute("aria-pressed", String(!shut));
  element.title = (shut ? "show " : "fold away ") + what;
}

function loadView() {
  // The reader's settings come from the browser, and this is the boundary that
  // matters: how wide a column is on this screen is not a claim about the
  // document, and a review history in which every entry *is* such a claim is what
  // makes the history worth reading. So none of this is an event.
  //
  // The key is per origin and the origin is stable, because the port is derived
  // from the document's path — which is what makes the settings outlive a restart
  // without anything being written somewhere shared.
  let stored = null;
  try { stored = window.localStorage.getItem(VIEW_KEY); } catch (error) { stored = null; }
  state.view = readView(stored, window.innerWidth);
  applyView();
}

function saveView() {
  // Storage can refuse — a private window, a filled quota — and a layout that
  // cannot be remembered is no reason to stop drawing the page. It then holds for
  // this tab, which is the whole of what is lost.
  try { window.localStorage.setItem(VIEW_KEY, writeView(state.view)); } catch (error) { return; }
}

function moveView(action) {
  // Applied and not remembered: a drag in progress would otherwise be one
  // localStorage write per frame, none of which anybody asked for.
  state.view = viewAfter(state.view, action);
  applyView();
}

function setView(action) {
  moveView(action);
  saveView();
}

function dragHandle(id, field, sign) {
  // `sign` is which direction means wider. The bar's handle is to the right of the
  // bar, so dragging right widens it; the thread column's handle is to its left,
  // where that same drag makes it narrower.
  const handle = $(id);
  handle.addEventListener("pointerdown", (event) => {
    // Pointer capture rather than listeners on the document: the pointer leaves a
    // handle this thin on the first frame, and every move after that still has to
    // arrive here — including the release, which may happen off the window.
    event.preventDefault();
    handle.setPointerCapture(event.pointerId);
    handle.classList.add("dragging");
    const from = event.clientX;
    const started = state.view[field];
    const move = (moved) => moveView({
      kind: "size", field, px: started + sign * (moved.clientX - from),
    });
    const done = () => {
      handle.removeEventListener("pointermove", move);
      handle.removeEventListener("pointerup", done);
      handle.removeEventListener("pointercancel", done);
      handle.classList.remove("dragging");
      saveView();
    };
    handle.addEventListener("pointermove", move);
    handle.addEventListener("pointerup", done);
    handle.addEventListener("pointercancel", done);
  });
  // The default is one double-click away, because a handle dragged somewhere
  // unhelpful is exactly the moment a reviewer wants the layout they know back.
  handle.addEventListener("dblclick", () => setView({ kind: "reset", field }));
}

// -- wiring ---------------------------------------------------------------

function applyMode(mode) {
  // The mode bar and nothing else. Kept apart from the redraw because `load` has
  // its own order to keep — the document before the threads that point into it —
  // and a mode setter that redrew in the middle of that would decide it here.
  state.mode = mode;
  const reason = diffReason(state.data);
  // `#modes` and not `.modes`: the arrangement controls borrow the same segmented
  // look, and a loop over the class would set `aria-pressed="false"` on all of
  // them — a fold button reporting the opposite of what the column is doing.
  document.querySelectorAll("#modes button").forEach((element) => {
    element.setAttribute("aria-pressed", String(element.dataset.mode === mode));
    if (element.dataset.mode !== "diff") return;
    // Disabled and carrying the reason, rather than hidden. A mode that vanishes
    // looks like a mode this tool does not have, and a reviewer who wanted it
    // would go looking for the flag that turns it on.
    element.disabled = Boolean(reason);
    element.title = reason || "the document as it is now, against this round's base";
  });
  if (mode !== "raw" && state.editing) stopEditing();
}

function setMode(mode) {
  applyMode(mode);
  renderControls();
  draw();
}

function renderControls() {
  // A mode button is clickable before the first state has arrived.
  if (!state.data) return;
  const host = $("doc");
  const existing = $("modebar");
  if (existing) existing.remove();
  const bar = document.createElement("div");
  bar.id = "modebar";
  bar.className = "row";
  if (state.mode === "diff") {
    const label = document.createElement("label");
    label.className = "check";
    const box = document.createElement("input");
    box.type = "checkbox";
    box.id = "changesonly";
    box.addEventListener("change", draw);
