[project]
name = "specround"
# One version, in src/specround/__init__.py — see [tool.hatch.version] below.
dynamic = ["version"]
description = "Spec review rounds for humans and AI agents — anchored comments, suggestion diffs, and an append-only disposition ledger. No server, no git dependency."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
keywords = ["review", "spec", "annotation", "ledger", "agents"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  # Appending needs an exclusive file lock (fcntl). Reading works anywhere;
  # writing on a platform without the lock is refused rather than guessed at.
  "Operating System :: POSIX",
  "Operating System :: MacOS",
  "Programming Language :: Python :: 3",
  "Topic :: Software Development :: Documentation",
]
dependencies = []

[project.scripts]
specround = "specround.cli:main"

[project.urls]
Homepage = "https://github.com/haung921209/specround"

[dependency-groups]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# The version is read out of the package, not repeated here. A Homebrew formula
# asserts `specround --version` prints the version brew resolved from the
# tarball name, so a metadata version that drifts from ``__version__`` is a
# failed install, not a cosmetic mismatch.
[tool.hatch.version]
path = "src/specround/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/specround"]

[tool.hatch.build.targets.sdist]
# What a source build needs, and nothing else: the package, its tests, and the
# documents the README points at. Everything else is repository furniture.
include = [
  "/src",
  "/tests",
  "/docs",
  "/adapters",
  "/README.md",
  "/SPEC.md",
  "/LICENSE",
  "/pyproject.toml",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
